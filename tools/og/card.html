<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: 'Inter'; font-weight: 500; src: url('inter-500.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-weight: 600; src: url('inter-600.ttf') format('truetype'); }
  @font-face { font-family: 'Inter'; font-weight: 700; src: url('inter-700.ttf') format('truetype'); }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* Mirrors the live counter page in dark appearance: black, white tabular
     numerals, and one soft two-colour wash. The wash uses the same OKLCH
     recipe as CD.paint() in the site (w1 at L 0.72, w2 at L 0.70). */
  :root {
    --h1: {{h1}};
    --h2: {{h2}};
    --c: {{c}};
    --w1: oklch(0.72 var(--c) var(--h1));
    --w2: oklch(0.70 calc(var(--c) * 0.9) var(--h2));
    --tint: oklch(0.80 min(var(--c), 0.15) var(--h1));
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.62);
    --fill: rgba(118,118,128,0.24);
  }

  html, body { width: 1200px; height: 630px; background: #000; }
  body {
    position: relative;
    overflow: hidden;
    font-family: 'Inter', system-ui, sans-serif;
    font-feature-settings: "tnum";
    color: var(--label);
    -webkit-font-smoothing: antialiased;
  }

  /* Absolute (not fixed) so it fills the 630px page box, not the viewport --
     headless Chromium's viewport is shorter than the page it screenshots. */
  .wash {
    position: absolute;
    top: 0; left: 0;
    width: 1200px; height: 630px;
    background:
      radial-gradient(70% 85% at 0% 0%, color-mix(in srgb, var(--w1) 46%, transparent), transparent 75%),
      radial-gradient(65% 80% at 100% 100%, color-mix(in srgb, var(--w2) 32%, transparent), transparent 75%);
  }

  .frame {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 30px;
    padding: 48px 64px;
    text-align: center;
  }

  .wordmark { font-size: 36px; font-weight: 700; letter-spacing: -0.035em; }
  .wordmark .sub { color: var(--label-2); font-weight: 500; letter-spacing: -0.02em; }

  .num { font-weight: 600; line-height: 1; letter-spacing: -0.035em; white-space: nowrap; }

  /* Countdown: numerals with small unit labels, no tiles. */
  .digits { display: flex; gap: 56px; align-items: flex-start; }
  .unit { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .digits .num { font-size: 156px; }
  .unit-label { font-size: 22px; font-weight: 500; color: var(--label-2); letter-spacing: 0; }

  /* Timer: the ring from the live page. */
  .ring-wrap { position: relative; width: 300px; height: 300px; display: grid; place-items: center; }
  .ring { position: absolute; inset: 0; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 7; }
  .ring .track { stroke: var(--fill); }
  .ring .prog { stroke: var(--tint); stroke-linecap: round; }
  .ring-wrap .num { font-size: 92px; }

  /* Stopwatch: one big readout. */
  .readout .num { font-size: 168px; }

  .headline { font-size: 44px; font-weight: 700; letter-spacing: -0.028em; line-height: 1.1; }
  .footnote { font-size: 21px; font-weight: 500; color: var(--label-2); letter-spacing: 0; }
</style>
</head>
<body>
<div class="wash"></div>
<div class="frame">
  <div class="wordmark">clockdown<span class="sub">{{sub}}</span></div>
  {{visual}}
  <div class="headline">{{headline}}</div>
  <div class="footnote">{{footnote}}</div>
</div>
</body>
</html>
