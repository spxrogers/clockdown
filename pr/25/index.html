<style>
/* ============================================================
   DESIGN SYSTEM
   System type, adaptive light/dark colour, translucent materials,
   spring easing. Shared by every page (inlined, no build step).
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Counter colours are registered so a change cross-fades instead of snapping.
   JS paints them from the counter's emoji (or a chosen theme); see CD.paint(). */
@property --w1     { syntax: '<color>'; inherits: true; initial-value: #8e8e93; }
@property --w2     { syntax: '<color>'; inherits: true; initial-value: #aeaeb2; }
@property --tint-l { syntax: '<color>'; inherits: true; initial-value: #3a3a3c; }
@property --tint-d { syntax: '<color>'; inherits: true; initial-value: #d1d1d6; }

:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;

  /* Light appearance */
  --bg: #f2f2f7;
  --bg-2: #ffffff;
  --bg-3: #ffffff;
  --fill: rgba(120,120,128,0.12);
  --fill-2: rgba(120,120,128,0.2);
  --label: #000000;
  --label-2: rgba(60,60,67,0.62);
  --label-3: rgba(60,60,67,0.32);
  --sep: rgba(60,60,67,0.29);
  --material: rgba(246,246,250,0.74);
  --material-solid: #f6f6fa;
  --edge: rgba(255,255,255,0.75);
  --seg-thumb: #ffffff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 1px 3px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.08);
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --wash-a: 30%;
  --wash-b: 20%;

  /* Two colour roles, kept apart on purpose:
     ink   = every control (buttons, selection, focus). Neutral, so it never competes.
     tint  = the counter's own colour, used only on the counter and its preview. */
  --ink: #000000;
  --on-ink: #ffffff;
  --accent: var(--ink);
  --on-accent: var(--on-ink);
  --tint: var(--tint-l);

  /* Springs. JS replaces these with CSS linear() curves sampled from a real
     critically damped spring (damping 1.0); these cubic-béziers are the fallback. */
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur: 520ms;
  --ease-fast: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur-fast: 380ms;

  transition: --w1 600ms ease, --w2 600ms ease, --tint-l 450ms ease, --tint-d 450ms ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-2: #1c1c1e;
    --bg-3: #2c2c2e;
    --fill: rgba(118,118,128,0.24);
    --fill-2: rgba(118,118,128,0.36);
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.62);
    --label-3: rgba(235,235,245,0.32);
    --sep: rgba(84,84,88,0.65);
    --material: rgba(24,24,27,0.72);
    --material-solid: #18181b;
    --edge: rgba(255,255,255,0.09);
    --seg-thumb: #636366;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 1px 3px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --wash-a: 36%;
    --wash-b: 24%;
    --ink: #ffffff;
    --on-ink: #000000;
    --tint: var(--tint-d);
  }
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Body: system font, comfortable leading, tracking near zero. */
body {
  font: 400 1.0625rem/1.47 var(--font);
  letter-spacing: -0.01em;
  color: var(--label);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  overflow-x: hidden;
  transition: background-color 400ms ease, color 400ms ease;
}


a { color: var(--accent); text-decoration: none; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Everything pressable: feedback lands on pointer-down, instantly. */
.press {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform var(--dur-fast) var(--ease), background-color 200ms ease, color 200ms ease, opacity 200ms ease, box-shadow 200ms ease;
}
.press:active:not(:disabled) {
  transform: scale(0.97);
  transition: transform 100ms ease-out, background-color 100ms ease-out;
}

/* ---- Navigation bar: a translucent layer that content scrolls under ---- */
.bar {
  position: sticky;
  top: 0;
  z-index: 50;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
/* Scroll-edge effect: no hard divider. The material fades in 1:1 with scroll,
   and its bottom edge is a soft mask instead of a 1px line. */
.bar::before {
  content: "";
  position: absolute;
  inset: 0 0 -14px;
  z-index: -1;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  opacity: var(--edge-p, 0);
}

/* Mini preview (phone only): once the card's numbers scroll under the bar, a
   compact copy of it settles in just below, so the live preview stays in view
   while you fill in the form. Tap it to jump back to the full card. */
.mini {
  position: absolute;
  top: calc(100% + 2px);
  left: 50%;
  width: min(calc(100% - 32px), 32rem);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px 9px 12px;
  border: 0;
  border-radius: 18px;
  overflow: hidden;
  isolation: isolate;
  color: var(--label);
  font: inherit;
  text-align: left;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: var(--shadow-lg);
  opacity: 0;
  transform: translate(-50%, -10px) scale(0.96);
  pointer-events: none;
  transition: transform var(--dur) var(--ease), opacity 180ms ease;
}
.mini::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(90% 140% at 0% 0%, color-mix(in srgb, var(--w1) var(--wash-a), transparent), transparent 75%),
    radial-gradient(80% 140% at 100% 100%, color-mix(in srgb, var(--w2) var(--wash-b), transparent), transparent 75%);
}
.mini.on { opacity: 1; transform: translate(-50%, 0) scale(1); pointer-events: auto; }
.mini.on:active { transform: translate(-50%, 0) scale(0.97); }
.mini-emoji { font-size: 1.375rem; line-height: 1; flex: none; }
.mini-name {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: -0.01em;
}
.mini-name.placeholder { color: var(--label-3); }
.mini .num { flex: none; font-size: 1.25rem; }
@media (min-width: 920px) { .mini { display: none; } }
@media (prefers-reduced-motion: reduce) {
  .mini, .mini.on, .mini.on:active { transform: translate(-50%, 0); }
}

/* Segmented control. Specific labels, current page marked. */
.seg {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 2px;
  border-radius: 10px;
  background: var(--fill);
  width: min(100%, 22rem);
}
.seg a {
  position: relative;
  display: block;
  padding: 0.4375rem 0.625rem;
  border-radius: 8px;
  color: var(--label);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.003em;
  text-align: center;
  white-space: nowrap;
}
.seg a[aria-current="page"] {
  background: var(--seg-thumb);
  box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04), inset 0 0 0 0.5px rgba(0,0,0,0.04);
}
.seg a:not([aria-current]):active { background: var(--fill); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 3.125rem;
  padding: 0 1.375rem;
  border-radius: 999px;
  background: var(--fill);
  color: var(--accent);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.012em;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn svg { width: 1.125em; height: 1.125em; flex-shrink: 0; }
@media (hover: hover) {
  .btn:not(.btn-primary):not(:disabled):hover { background: var(--fill-2); }
  .btn-primary:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 88%, var(--label)); }
}

/* Floating pill: lighter material for interactive chrome.
   Vibrancy rule: heavier weight + a hair more tracking on translucent surfaces. */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 2.5rem;
  padding: 0 1rem;
  border-radius: 999px;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 0 0 0.5px var(--edge), var(--shadow-sm);
  color: var(--label);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0;
}
.pill svg { width: 1.0625rem; height: 1.0625rem; }
.wordmark-pill { font-family: var(--font-round); font-weight: 700; letter-spacing: -0.02em; }

.wordmark {
  font-family: var(--font-round);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--label);
}

/* ---- Accessibility: transparency, contrast ---- */
@media (prefers-reduced-transparency: reduce) {
  .bar::before, .pill, .toast, .actions::before, .mini {
    background: var(--material-solid) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}
@media (prefers-contrast: more) {
  :root { --label-2: color-mix(in srgb, var(--label) 82%, transparent); --sep: var(--label-3); }
  .bar::before, .pill, .toast, .actions::before, .mini { background: var(--material-solid) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .pill, .btn, .seg, .group, .card { box-shadow: inset 0 0 0 1px var(--label-3) !important; }
}
/* ============================================================
   CREATOR + COUNTER COMPONENTS
   ============================================================ */
[hidden] { display: none !important; }

/* ---- Creator layout ---- */
#creator { display: none; }
#creator.active { display: block; }

.creator {
  width: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding: 4px 16px calc(env(safe-area-inset-bottom) + 112px);
}
.hero { display: flex; flex-direction: column; gap: 20px; }
.masthead { padding: 8px 4px 0; }
.masthead .wordmark { font-size: 2.125rem; line-height: 1.1; }
.tagline { margin-top: 2px; color: var(--label-2); font-size: 0.9375rem; line-height: 1.35; letter-spacing: -0.006em; }

@media (min-width: 920px) {
  .creator {
    max-width: 66rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 27rem;
    gap: 48px;
    align-items: start;
    padding: 12px 32px 64px;
  }
  .hero {
    position: sticky;
    top: 68px;
    min-height: calc(100vh - 96px);
    justify-content: center;
    gap: 24px;
  }
  .masthead .wordmark { font-size: 2.75rem; }
  .form { padding-top: 8px; }
}

/* ---- Preview card: a miniature of the shared page ---- */
.card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 24px;
  background: var(--bg-2);
  box-shadow: var(--shadow-lg);
  padding: 22px 16px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  view-transition-name: stage;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(90% 75% at 0% 0%, color-mix(in srgb, var(--w1) var(--wash-a), transparent), transparent 75%),
    radial-gradient(80% 70% at 100% 100%, color-mix(in srgb, var(--w2) var(--wash-b), transparent), transparent 75%);
}
.card-eyebrow {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-2);
}
.card-emoji { font-size: 2.75rem; line-height: 1.15; margin-top: 4px; view-transition-name: v-emoji; }
.card-title {
  max-width: 100%;
  font-size: 1.375rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  view-transition-name: v-title;
}
.card-title.placeholder { color: var(--label-3); }
.card-caption { font-size: 0.8125rem; line-height: 1.38; color: var(--label-2); letter-spacing: 0; font-variant-numeric: tabular-nums; }
@media (min-width: 920px) {
  .card { padding: 40px 28px 36px; gap: 12px; border-radius: 32px; }
  .card-emoji { font-size: 3.5rem; }
  .card-title { font-size: 2rem; letter-spacing: -0.025em; }
  .card-caption { font-size: 0.9375rem; }
}

/* ---- Numerals ---- */
.digits { display: flex; justify-content: center; align-items: flex-start; view-transition-name: v-digits; }
.unit { display: flex; flex-direction: column; align-items: center; }
.num {
  font-family: var(--font-round);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.unit-label {
  margin-top: 4px;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--label-2);
}
.card .digits { gap: clamp(12px, 4.5vw, 28px); margin: 4px 0 2px; }
.card .num { font-size: clamp(2.25rem, 10.5vw, 3.25rem); }
@media (min-width: 920px) { .card .num { font-size: 4rem; } .card .digits { gap: 32px; } }

/* Rolling digits (a numeric content transition). Each glyph has a slot;
   a change rolls the old glyph out and the new one in, in the direction of counting. */
.dg { display: inline-block; position: relative; }
.dg > span { display: inline-block; }
.dg > .dg-out { position: absolute; left: 0; top: 0; }

/* ---- Inset grouped form ---- */
.form { display: flex; flex-direction: column; }
.group-title {
  margin: 26px 0 0;
  padding: 0 16px 7px;
  font-size: 0.8125rem;
  font-weight: 400;
  line-height: 1.38;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--label-2);
}
.form > .group:first-child { margin-top: 24px; }
@media (min-width: 920px) { .form > .group:first-child { margin-top: 0; } }
.group-foot {
  padding: 7px 16px 0;
  font-size: 0.8125rem;
  line-height: 1.38;
  letter-spacing: 0;
  color: var(--label-2);
}
.group {
  background: var(--bg-2);
  border-radius: 14px;
  overflow: hidden;
}
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 2.875rem;
  padding: 0.5rem 16px;
  text-align: left;
  color: var(--label);
}
button.row:active { background: var(--fill); }
.group > .row:not(:first-child)::before,
.hairline::before {
  content: "";
  position: absolute;
  top: 0; left: 16px; right: 0;
  height: 1px;
  background: var(--sep);
  transform-origin: top;
}
@media (min-resolution: 2dppx) {
  .group > .row:not(:first-child)::before, .hairline::before { transform: scaleY(0.5); }
}
.row-label { flex: 1; min-width: 0; }
.row-input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: 1.0625rem;
  color: var(--label);
}
.row-input::placeholder { color: var(--label-3); }
.row-value {
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0.375rem 0.6875rem;
  border-radius: 8px;
  background: var(--fill);
  font-variant-numeric: tabular-nums;
  transition: color 200ms ease;
}
.row[aria-expanded="true"] .row-value { background: var(--ink); color: var(--on-ink); }

/* Inline disclosure: the row grows open in place, and closes back the same way.
   CSS transitions retarget from the current value, so it can be reversed mid-flight. */
.expand {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur) var(--ease);
}
.expand.open { grid-template-rows: 1fr; }
.expand-inner {
  position: relative;
  min-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 240ms ease;
}
.expand.open .expand-inner { opacity: 1; transition-delay: 40ms; }

/* ---- Calendar ---- */
.cal { padding: 6px 10px 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 4px 10px; }
.cal-title { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.012em; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 999px;
  color: var(--accent);
}
.icon-btn:active { background: var(--fill); }
.icon-btn:disabled { color: var(--label-3); }
.icon-btn svg { width: 1.25rem; height: 1.25rem; }
.cal-nav { display: flex; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.cal-wd {
  padding: 6px 0 4px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--label-3);
}
.cal-day {
  justify-self: center;
  width: min(2.75rem, 100%);
  aspect-ratio: 1;
  border-radius: 999px;
  font-size: 1.125rem;
  line-height: 1;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  color: var(--label);
}
.cal-day.today { color: var(--red); font-weight: 600; }
.cal-day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal-day:disabled { color: var(--label-3); cursor: default; }
.cal-day:not(:disabled):not([aria-pressed="true"]):active { background: var(--fill); }
.cal-pad { visibility: hidden; }

/* ---- Wheel picker ---- */
.wheels {
  --item-h: 2.25rem;
  position: relative;
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 10px 12px;
}
.wheels::before {
  content: "";
  position: absolute;
  left: 12px; right: 12px; top: 50%;
  height: var(--item-h);
  transform: translateY(-50%);
  border-radius: 10px;
  background: var(--fill);
  pointer-events: none;
}
.wheel {
  position: relative;
  width: 4.5rem;
  height: calc(var(--item-h) * 5.4);
  perspective: 900px;
  touch-action: none;
  cursor: grab;

.stage::before {

.ring-wrap {

  <div class="stage-top">

    <button class="pill press" type="button" id="btn-share"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V2.8M6.6 6 10 2.6 13.4 6"/><path d="M7 8.6H5.5a1.5 1.5 0 0 0-1.5 1.5v6.4a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-6.4a1.5 1.5 0 0 0-1.5-1.5H13"/></svg>Share</button>
  </div>
  <main class="stage-body">
    <div class="stage-emoji" id="cd-emoji"></div>
    <h1 class="stage-title" id="cd-name"></h1>
    <div class="digits" id="cd-digits" role="timer" aria-live="off">
      <div class="unit"><span class="num" id="cd-d" aria-hidden="true">00</span><span class="unit-label" id="cd-dl">days</span></div>
      <div class="unit"><span class="num" id="cd-h" aria-hidden="true">00</span><span class="unit-label" id="cd-hl">hours</span></div>
      <div class="unit"><span class="num" id="cd-m" aria-hidden="true">00</span><span class="unit-label" id="cd-ml">minutes</span></div>
      <div class="unit"><span class="num" id="cd-s" aria-hidden="true">00</span><span class="unit-label" id="cd-sl">seconds</span></div>
    </div>
    <div class="celebrate" id="cd-cel" hidden>It's time!</div>
    <p class="stage-caption" id="cd-caption"></p>
  </main>
  <div class="stage-foot">
    <button class="text-btn press" type="button" id="btn-new">Make your own countdown</button>
  </div>
</div>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div id="ad-slot"></div>

<script>
/* ============================================================
   CD — shared interaction + motion toolkit (no dependencies)
   ============================================================ */
const CD = (function () {
  'use strict';

  const root = document.documentElement;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (s, r) => (r || document).querySelector(s);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // iOS Safari only applies :active while a touch listener exists. Feedback must land on touch-down.
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* ---------- Springs ----------
     Apple's two designer-facing parameters: damping ratio (1 = no overshoot)
     and response (seconds to reach the target; not a duration).
     stiffness = (2π / response)², damping coefficient = 4π·ζ / response, mass = 1. */
  function springCoeffs(damping, response) {
    return { k: Math.pow(2 * Math.PI / response, 2), c: 4 * Math.PI * damping / response };
  }

  // Sample a spring from 0 → 1 into a CSS linear() easing so time-based CSS/WAAPI
  // animations share exactly the same curve as the gesture-driven springs.
  function springCurve(damping, response) {
    const { k, c } = springCoeffs(damping, response);
    const dt = 1 / 1000;
    let x = 0, v = 0, t = 0;
    const samples = [0];
    while (t < 2) {
      const a = k * (1 - x) - c * v;
      v += a * dt; x += v * dt; t += dt;
      samples.push(x);
      if (Math.abs(1 - x) < 0.002 && Math.abs(v) < 0.02) break;
    }
    const n = 40, pts = [];
    for (let i = 0; i <= n; i++) {
      const s = samples[Math.round((samples.length - 1) * i / n)];
      pts.push(+(i === n ? 1 : s).toFixed(4));
    }
    return { easing: 'linear(' + pts.join(', ') + ')', ms: Math.round(t * 1000) };
  }

  const SPRING = { easing: 'cubic-bezier(0.2, 0.9, 0.25, 1)', ms: 520 };
  const SPRING_FAST = { easing: 'cubic-bezier(0.2, 0.9, 0.25, 1)', ms: 380 };
  if (window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)')) {
    Object.assign(SPRING, springCurve(1, 0.42));
    Object.assign(SPRING_FAST, springCurve(1, 0.3));
    root.style.setProperty('--ease', SPRING.easing);
    root.style.setProperty('--dur', SPRING.ms + 'ms');
    root.style.setProperty('--ease-fast', SPRING_FAST.easing);
    root.style.setProperty('--dur-fast', SPRING_FAST.ms + 'ms');
  }

  // Momentum projection, from Apple's Designing Fluid Interfaces sample code.
  function project(velocity, decelerationRate) {
    const d = decelerationRate || 0.998;
    return (velocity / 1000) * d / (1 - d);
  }

  // Progressive resistance past a boundary instead of a hard stop.
  function rubberband(overshoot, dimension, constant) {
    const c = constant || 0.55;
    return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
  }

  /* ---------- Feedback ---------- */
  function haptic(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* unsupported */ }
  }

  const CHECK = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6 10.4l2.6 2.6L14.2 7.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.innerHTML = CHECK + '<span></span>';
    el.lastChild.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function copyLink(url) {
    copyText(url).then(() => { toast('Link copied'); haptic(8); })
      .catch(() => { window.prompt('Copy this link:', url); });
  }

  // Link unfurlers never receive the #hash, so the preview card in iMessage/Slack/etc
  // is always the generic one. Passing the name as share `text` puts it in the message body.
  function share(url, text) {
    if (navigator.share) {
      navigator.share({ title: document.title, text: text, url: url }).catch(() => {});
    } else {
      copyLink(url);
    }
  }

  /* ---------- Colour ----------
     A counter's colour is a palette { h1, h2, c }: two OKLCH hues and a chroma.
     It comes from the counter's emoji by default, or from a named theme.
     OKLCH keeps lightness perceptually even across hues, so every palette gets
     legible text tints in light and dark without per-theme hand-tuning. */
  const THEMES = [
    { id: 'galaxy',  label: 'Galaxy',  h1: 292, h2: 258, c: 0.15 },
    { id: 'sunset',  label: 'Sunset',  h1: 52,  h2: 24,  c: 0.17 },
    { id: 'ocean',   label: 'Ocean',   h1: 244, h2: 196, c: 0.14 },
    { id: 'neon',    label: 'Neon',    h1: 132, h2: 104, c: 0.18 },
    { id: 'minimal', label: 'Minimal', h1: 0,   h2: 0,   c: 0 },
  ];
  const NEUTRAL = { h1: 0, h2: 0, c: 0 };

  const lin = v => (v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4));
  const gam = v => (v <= 0.0031308 ? 12.92 * v : 1.055 * Math.pow(v, 1 / 2.4) - 0.055);

  function srgbToOklab(r, g, b) {
    r = lin(r); g = lin(g); b = lin(b);
    const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
    const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
    const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
    return [
      0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s,
      1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s,
      0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s,
    ];
  }
  function oklabToSrgb(L, a, b) {
    const l = Math.pow(L + 0.3963377774 * a + 0.2158037573 * b, 3);
    const m = Math.pow(L - 0.1055613458 * a - 0.0638541728 * b, 3);
    const s = Math.pow(L - 0.0894841775 * a - 1.2914855480 * b, 3);
    return [
      gam(4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s),
      gam(-1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s),
      gam(-0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s),
    ];
  }
  // OKLCH → hex, reducing chroma until the colour fits in sRGB (keeps hue and lightness).
  function oklch(L, C, h) {
    const rad = h * Math.PI / 180;
    for (let c = C; c >= 0; c -= 0.004) {
      const rgb = oklabToSrgb(L, c * Math.cos(rad), c * Math.sin(rad));
      if (rgb.every(v => v >= -0.0005 && v <= 1.0005) || c < 0.004) {
        return '#' + rgb.map(v => Math.round(clamp(v, 0, 1) * 255).toString(16).padStart(2, '0')).join('');
      }
    }
    return '#808080';
  }

  // Read the emoji's own colours: draw it small, bucket its saturated pixels by
  // hue (weighted by chroma), take the strongest hue and a distinct second one.
  const emojiCache = {};
  function emojiPalette(emoji) {
    emoji = (emoji || '').trim();
    if (!emoji) return NEUTRAL;
    if (emojiCache[emoji]) return emojiCache[emoji];
    let pal = NEUTRAL;
    try {
      const S = 56;
      const cv = document.createElement('canvas');
      cv.width = cv.height = S;
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `${Math.round(S * 0.78)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif`;
      ctx.fillText(emoji, S / 2, S / 2 + S * 0.04);
      const px = ctx.getImageData(0, 0, S, S).data;
      const BINS = 36, w = new Float64Array(BINS), A = new Float64Array(BINS), B = new Float64Array(BINS);
      let opaque = 0, total = 0;
      for (let i = 0; i < px.length; i += 4) {
        const alpha = px[i + 3] / 255;
        if (alpha < 0.5) continue;
        opaque++;
        const [L, a, b] = srgbToOklab(px[i] / 255, px[i + 1] / 255, px[i + 2] / 255);
        const C = Math.hypot(a, b);
        if (C < 0.045 || L < 0.2 || L > 0.97) continue;   // skip greys, outlines, highlights
        const h = (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
        const k = Math.floor(h / 10) % BINS, wt = C * alpha;
        w[k] += wt; A[k] += a * wt; B[k] += b * wt; total += wt;
      }
      if (opaque && total / opaque > 0.025) {
        const sm = Array.from(w, (_, k) => w[(k + BINS - 1) % BINS] * 0.5 + w[k] + w[(k + 1) % BINS] * 0.5);
        const p1 = sm.indexOf(Math.max(...sm));
        let p2 = -1;
        sm.forEach((v, k) => {
          const d = Math.min(Math.abs(k - p1), BINS - Math.abs(k - p1));
          if (d >= 4 && v >= sm[p1] * 0.3 && (p2 < 0 || v > sm[p2])) p2 = k;
        });
        const hueOf = k => {
          let a = 0, b = 0;
          for (let j = -1; j <= 1; j++) { const q = (k + j + BINS) % BINS; a += A[q]; b += B[q]; }
          return (Math.atan2(b, a) * 180 / Math.PI + 360) % 360;
        };
        const chromaOf = k => {
          let a = 0, b = 0, ww = 0;
          for (let j = -1; j <= 1; j++) { const q = (k + j + BINS) % BINS; a += A[q]; b += B[q]; ww += w[q]; }
          return ww ? Math.hypot(a, b) / ww : 0;
        };
        const h1 = hueOf(p1);
        pal = { h1, h2: p2 >= 0 ? hueOf(p2) : (h1 + 32) % 360, c: clamp(chromaOf(p1), 0.07, 0.17) };
      }
    } catch (e) { pal = NEUTRAL; }
    return (emojiCache[emoji] = pal);
  }

  function themePalette(id) { return THEMES.find(t => t.id === id) || null; }

  // Swatch / accent colour for a palette.
  const dotColor = p => (p.c ? oklch(0.68, p.c, p.h1) : '#8e8e93');

  function paint(p) {
    const st = root.style;
    st.setProperty('--w1', oklch(0.72, p.c, p.h1));
    st.setProperty('--w2', oklch(0.70, p.c * 0.9, p.h2));
    // Text-safe tints: dark enough on white, light enough on black.
    // Yellow can't be both dark enough for white and still yellow (it turns khaki),
    // so its light-mode tint bends toward amber instead.
    const hl = p.h1 > 60 && p.h1 < 118 ? 60 + (p.h1 - 60) * 0.2 : p.h1;
    st.setProperty('--tint-l', p.c ? oklch(hl === p.h1 ? 0.5 : 0.55, Math.min(Math.max(p.c, 0.12), 0.16), hl) : '#3a3a3c');
    st.setProperty('--tint-d', p.c ? oklch(0.8, Math.min(p.c, 0.15), p.h1) : '#d1d1d6');
  }

  // A named theme wins; otherwise the colour comes from the emoji.
  function paintFor(theme, emoji) {
    const t = themePalette(theme);
    root.dataset.theme = t ? t.id : 'auto';
    paint(t || emojiPalette(emoji));
  }

  /* ---------- Scroll edge: bar material follows scroll 1:1 ---------- */
  function scrollEdge(bar) {
    if (!bar) return;
    let raf = 0;
    const update = () => { raf = 0; bar.style.setProperty('--edge-p', clamp(window.scrollY / 24, 0, 1).toFixed(3)); };
    window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
    update();
  }

  /* ---------- Mini preview: a compact copy of the card pinned under the bar ---------- */
  function miniPreview(bar, card, dir) {
    if (!bar || !card) return;
    const digits = card.querySelector('.digits');
    if (!digits) return;
    const mini = document.createElement('button');
    mini.type = 'button';
    mini.className = 'mini';
    // Purely a visual convenience; the full card stays in the accessibility tree.
    mini.setAttribute('aria-hidden', 'true');
    mini.tabIndex = -1;
    mini.innerHTML = '<span class="mini-emoji"></span><span class="mini-name"></span><span class="num"></span>';
    bar.appendChild(mini);
    const [mEmoji, mName, mNum] = mini.children;
    const srcEmoji = card.querySelector('.card-emoji');
    const srcName = card.querySelector('.card-title');
    const valueOf = el => el._slots ? el._slots.map(s => s.ch).join('') : el.textContent;

    let syncRaf = 0;
    const sync = () => {
      syncRaf = 0;
      mEmoji.textContent = srcEmoji ? srcEmoji.textContent : '';
      mName.textContent = srcName ? srcName.textContent : '';
      mName.classList.toggle('placeholder', !!srcName && srcName.classList.contains('placeholder'));
      const v = Array.from(digits.querySelectorAll('.num'), valueOf);
      // Countdown: days, hours, minutes, seconds. Drop the days while there are none.
      const text = v.length === 4 ? (v[0] !== '00' ? +v[0] + 'd ' : '') + v.slice(1).join(':') : v.join('');
      roll(mNum, text, mini.classList.contains('on') ? dir : 0);
    };
    new MutationObserver(() => { if (!syncRaf) syncRaf = requestAnimationFrame(sync); })
      .observe(card, { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['class'] });
    sync();

    const phone = window.matchMedia('(max-width: 919px)');
    let raf = 0;
    const update = () => {
      raf = 0;
      const on = phone.matches && digits.getBoundingClientRect().bottom < bar.getBoundingClientRect().bottom;
      if (on !== mini.classList.contains('on')) mini.classList.toggle('on', on);
    };
    const schedule = () => { if (!raf) raf = requestAnimationFrame(update); };
    window.addEventListener('scroll', schedule, { passive: true });
    window.addEventListener('resize', schedule);
    mini.addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: reduceMotion.matches ? 'auto' : 'smooth' });
    });
    update();
  }

  /* ---------- Hash ---------- */
  function parseHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    const params = {};
    hash.split('&').forEach(pair => {
      const [k, ...rest] = pair.split('=');
      if (!k || !rest.length) return;
      try { params[k] = decodeURIComponent(rest.join('=')); } catch (e) { params[k] = rest.join('='); }
    });
    return params;
  }

  /* ---------- View transitions ----------
     The preview card grows into the full page and shrinks back along the same path.
     Reduced motion: a plain cross-fade. */
  let firstRoute = true;
  function transition(update) {
    if (firstRoute || !document.startViewTransition) { firstRoute = false; update(); return; }
    root.classList.toggle('vt-fade', reduceMotion.matches);
    const vt = document.startViewTransition(update);
    vt.finished.finally(() => root.classList.remove('vt-fade'));
  }

  /* ---------- Rolling digits ----------
     dir -1: counting down, the new glyph drops in from above.
     dir +1: counting up, it rises from below. 0: no animation. */
  function roll(el, text, dir) {
    const chars = Array.from(String(text));
    let slots = el._slots;
    if (!slots || slots.length !== chars.length) {
      el.textContent = '';
      slots = el._slots = chars.map(ch => {
        const s = document.createElement('span');
        s.className = 'dg';
        const cur = document.createElement('span');
        cur.textContent = ch;
        s.appendChild(cur);
        el.appendChild(s);
        return { s, ch, cur };
      });
      return;
    }
    const animate = dir && !reduceMotion.matches && !document.hidden && typeof el.animate === 'function';
    chars.forEach((ch, i) => {
      const slot = slots[i];
      if (slot.ch === ch) return;
      slot.ch = ch;
      if (!animate) { slot.cur.textContent = ch; return; }
      const old = slot.cur;
      const nu = document.createElement('span');
      nu.textContent = ch;
      old.classList.add('dg-out');
      slot.s.appendChild(nu);
      slot.cur = nu;
      const d = dir > 0 ? 1 : -1;
      old.animate(
        [{ transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' },
         { transform: `translateY(${-d * 42}%)`, opacity: 0, filter: 'blur(3px)' }],
        { duration: 240, easing: 'cubic-bezier(0.3, 0, 0.8, 0.6)', fill: 'forwards' }
      ).onfinish = () => old.remove();
      nu.animate(
        [{ transform: `translateY(${d * 42}%)`, opacity: 0, filter: 'blur(3px)' },
         { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }],
        { duration: SPRING_FAST.ms, easing: SPRING_FAST.easing }
      );
    });
  }

  /* ---------- Wheel picker ----------
     1:1 drag (grab offset respected, pointer capture), interruptible at any instant
     (it is caught at its on-screen position), release velocity handed to a critically
     damped spring, landing chosen from the momentum projection, rubber-banded ends. */
  function Wheel(el, opts) {
    const count = opts.count;
    const format = opts.format || (i => String(i));
    const onChange = opts.onChange || (() => {});
    const { k: K, c: C } = springCoeffs(1, 0.42);

    let index = clamp(opts.index || 0, 0, count - 1);
    let p = index;             // position, in items (presentation value)
    let v = 0;                 // velocity, items / second
    let target = p;
    let raf = 0, lastT = 0;
    let H = 36, R = H * 2.4;   // item height / drum radius (px)
    let silent = true;

    el.classList.add('wheel');
    if (opts.unit) el.classList.add('has-unit');
    el.tabIndex = 0;
    el.setAttribute('role', 'spinbutton');
    el.setAttribute('aria-label', opts.label);
    el.setAttribute('aria-valuemin', String(opts.valueAt ? opts.valueAt(0) : 0));
    el.setAttribute('aria-valuemax', String(opts.valueAt ? opts.valueAt(count - 1) : count - 1));

    const items = [];
    for (let i = 0; i < count; i++) {
      const it = document.createElement('div');
      it.className = 'wheel-item';
      it.textContent = format(i);
      it.setAttribute('aria-hidden', 'true');
      el.appendChild(it);
      items.push(it);
    }
    if (opts.unit) {
      const u = document.createElement('span');
      u.className = 'wheel-unit';
      u.textContent = opts.unit;
      u.setAttribute('aria-hidden', 'true');
      el.appendChild(u);
    }

    function measure() {
      const h = items[0].offsetHeight;
      if (h) { H = h; R = H * 2.4; }
    }

    let visLo = 0, visHi = -1;
    function render() {
      const span = Math.ceil((Math.PI / 2) * R / H);
      const lo = clamp(Math.floor(p) - span, 0, count - 1);
      const hi = clamp(Math.ceil(p) + span, 0, count - 1);
      for (let i = visLo; i <= visHi; i++) if (i < lo || i > hi) items[i].style.visibility = 'hidden';
      for (let i = lo; i <= hi; i++) {
        const theta = ((i - p) * H) / R;
        const st = items[i].style;
        if (Math.abs(theta) >= Math.PI / 2) { st.visibility = 'hidden'; continue; }
        const y = R * Math.sin(theta);
        const z = R * (Math.cos(theta) - 1);
        st.transform = `translate3d(0, ${y.toFixed(2)}px, ${z.toFixed(2)}px) rotateX(${(-theta).toFixed(4)}rad)`;
        st.opacity = (1 - Math.abs(theta) / (Math.PI / 2) * 0.7).toFixed(3);
        st.visibility = 'visible';
      }
      visLo = lo; visHi = hi;

      const ci = clamp(Math.round(p), 0, count - 1);
      if (ci !== index || !items[ci].classList.contains('on')) {
        items[index].classList.remove('on');
        items[ci].classList.add('on');
        const changed = ci !== index;
        index = ci;
        el.setAttribute('aria-valuenow', String(opts.valueAt ? opts.valueAt(ci) : ci));
        el.setAttribute('aria-valuetext', opts.valueText ? opts.valueText(ci) : format(ci));
        if (changed && !silent) onChange(ci);
      }
    }

    function step(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000 || 1 / 60);
      lastT = t;
      let rem = dt;
      while (rem > 1e-6) {
        const h = Math.min(rem, 1 / 240);
        const a = -K * (p - target) - C * v;
        v += a * h; p += v * h; rem -= h;
      }
      if (Math.abs(p - target) < 0.002 && Math.abs(v) < 0.05) {
        p = target; v = 0; raf = 0; render(); return;
      }
      render();
      raf = requestAnimationFrame(step);
    }

    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    // Retargeting keeps the current velocity, so a new input never hits a "brick wall".
    function animateTo(i, velocity) {
      target = clamp(Math.round(i), 0, count - 1);

      if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }

    function setIndex(i, o) {
      o = o || {};

      if (o.animate === false || reduceMotion.matches) {
        stop(); p = target = i; v = 0; render();

    let drag = null;
    el.addEventListener('pointerdown', e => {

        const r = el.getBoundingClientRect();

    el.addEventListener('keydown', e => {
      let i = Math.round(target);

        case 'ArrowUp': i += 1; break;
        case 'ArrowDown': i -= 1; break;
        case 'PageUp': i += 5; break;
        case 'PageDown': i -= 5; break;
        case 'Home': i = 0; break;
        case 'End': i = count - 1; break;

          if (/^[0-9]$/.test(e.key) && opts.parse) {
            typed = (typed + e.key).slice(-3);

    render();

      el,
      get index() { return index; },

  /* ---------- Emoji grid + theme swatches (shared by every creator) ---------- */
  /* Underscore caret for browsers without `caret-shape: underscore`: hide the

     Blinks like a terminal, and holds solid for a moment after each keystroke. */
  function underscoreCaret(input) {
    if (window.CSS && CSS.supports && CSS.supports('caret-shape', 'underscore')) return;

      const focused = document.activeElement === input;

      const box = input.clientWidth - padL - padR;

      let x = val

    document.addEventListener('selectionchange', () => { if (document.activeElement === input) place(); });
  }

  function emojiPicker(grid, custom, emojis, initial, onPick) {
    let current = initial;
    underscoreCaret(custom);
    const btns = emojis.map(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emoji-btn press';
      b.textContent = e;
      b.setAttribute('aria-label', e);
      b.setAttribute('aria-pressed', String(e === initial));

      });

  // "Auto" (from the emoji) plus the named themes. Returns setEmoji() so the
  // Auto swatch can follow the chosen emoji.
  function themePicker(wrap, initial, onPick) {
    const opts = [{ id: 'auto', label: 'Auto' }].concat(THEMES);
    let autoDot = null;
    const btns = opts.map(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch press';
      b.setAttribute('aria-pressed', String(t.id === initial));
      b.setAttribute('aria-label', t.id === 'auto' ? 'Auto: colours from your emoji' : t.label);
      b.innerHTML = '<span class="swatch-dot" aria-hidden="true"></span><span class="swatch-label" aria-hidden="true"></span>';
      b.lastChild.textContent = t.label;
      if (t.id === 'auto') autoDot = b.firstChild;
      else b.firstChild.style.backgroundColor = dotColor(t);
      b.addEventListener('click', () => {
        btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));

      setEmoji(emoji) {

        autoDot.textContent = (emoji || '').trim();

  /* ---------- Disclosure rows (only one open at a time per group) ---------- */
  function disclosure(row, panel, onOpen) {
    row.setAttribute('aria-expanded', 'false');

      open() {
        disclosure.all.forEach(o => { if (o !== api) o.close(); });

    disclosure.all.push(api);
    return api;
  }
  disclosure.all = [];

  /* ---------- Confetti (delight, only once the moment is real) ---------- */
  let confettiOn = false;
  function confetti() {
    if (confettiOn || reduceMotion.matches) return;
    const canvas = $('#confetti');
    if (!canvas) return;
    confettiOn = true;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, Hh = window.innerHeight;
    canvas.width = W * dpr; canvas.height = Hh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#bf5af2', '#ff375f', '#ff9f0a', '#ffd60a', '#30d158', '#64d2ff', '#0a84ff'];
    const parts = [];
    for (let i = 0; i < 160; i++) {
      // Two bursts from the lower corners, thrown up and in.
      const left = i % 2 === 0;
      const ang = (left ? -60 : -120) + (Math.random() - 0.5) * 40;
      const sp = 9 + Math.random() * 9;
      parts.push({
        x: left ? -10 : W + 10, y: Hh * 0.85,
        vx: Math.cos(ang * Math.PI / 180) * sp, vy: Math.sin(ang * Math.PI / 180) * sp,
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        c: colors[(Math.random() * colors.length) | 0], life: 1,
      });
    }
    let last = performance.now();
    function draw(t) {
      const f = Math.min(2, (t - last) / 16.67); last = t;
      ctx.clearRect(0, 0, W, Hh);
      let alive = false;
      parts.forEach(q => {
        if (q.life <= 0) return;
        q.vx *= Math.pow(0.985, f); q.vy = q.vy * Math.pow(0.985, f) + 0.32 * f;
        q.x += q.vx * f; q.y += q.vy * f; q.rot += q.vr * f;
        if (q.vy > 0) q.life -= 0.006 * f;
        if (q.y > Hh + 20) q.life = 0;
        if (q.life <= 0) return;
        alive = true;
        ctx.save();
        ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 1.5));
        ctx.fillStyle = q.c;
        ctx.fillRect(-q.w / 2, -q.h / 2 * Math.abs(Math.cos(q.rot * 2)), q.w, q.h);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(draw);
      else { ctx.clearRect(0, 0, W, Hh); confettiOn = false; }
    }
    requestAnimationFrame(draw);
  }

  // A soft two-note chime, synthesised (no audio file). Only used where the user
  // pressed Start themselves, so the audio context is unlocked by their gesture.
  let audio = null;

  function chime() {
    if (!audio) return;
    try {
      const now = audio.currentTime;
      [[880, 0], [1318.5, 0.18], [880, 0.9], [1318.5, 1.08]].forEach(([f, at]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + at);
        g.gain.linearRampToValueAtTime(0.18, now + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.9);
        o.connect(g).connect(audio.destination);
        o.start(now + at); o.stop(now + at + 1);
      });
    } catch (e) { /* ignore */ }
  }

  const ICON = {
    share: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V2.8M6.6 6 10 2.6 13.4 6"/><path d="M7 8.6H5.5a1.5 1.5 0 0 0-1.5 1.5v6.4a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-6.4a1.5 1.5 0 0 0-1.5-1.5H13"/></svg>',
  };

  return {
    $, clamp, reduceMotion, SPRING, SPRING_FAST,
    haptic, toast, copyLink, share, THEMES, paintFor, emojiPalette, scrollEdge, miniPreview, parseHash,
    transition, roll, Wheel, emojiPicker, themePicker, disclosure, confetti,
    unlockAudio, chime, ICON,

})();

<script>
(function () {
  'use strict';
  const { $, clamp } = CD;

  const EMOJIS = ['🎉','🎂','🎄','💍','🚀','🏖️','🎓','⏰','👶','🏆','💪','🌙','🎃','❤️','✈️','🎵'];
  const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const WEEKDAYS = ['S','M','T','W','T','F','S'];

  // ---- TIME ZONES ----
  const ALL_TIMEZONES = (function () {
    try { return Intl.supportedValuesOf('timeZone'); }
    catch (e) {
      return ['Pacific/Honolulu','America/Anchorage','America/Los_Angeles','America/Denver',
        'America/Chicago','America/New_York','America/Sao_Paulo','Atlantic/Reykjavik',
        'Europe/London','Europe/Paris','Europe/Berlin','Europe/Moscow',
        'Asia/Dubai','Asia/Kolkata','Asia/Bangkok','Asia/Shanghai',
        'Asia/Tokyo','Asia/Seoul','Australia/Sydney','Pacific/Auckland','UTC'];
    }
  })();
  const DETECTED_TZ = Intl.DateTimeFormat().resolvedOptions().timeZone;

  // Cities with no IANA zone of their own (e.g. Dallas uses America/Chicago)
  // but that people search by city name.
  const CITY_ALIASES = {
    'america/chicago': ['dallas'],
  };

  const offsetCache = {};
  function tzOffsetLabel(tz) {
    if (offsetCache[tz] !== undefined) return offsetCache[tz];
    let label = '';
    try {
      const parts = new Intl.DateTimeFormat('en-US', { timeZone: tz, timeZoneName: 'shortOffset' }).formatToParts(new Date());
      const p = parts.find(x => x.type === 'timeZoneName');
      label = p ? p.value : '';
    } catch (e) { label = ''; }
    return (offsetCache[tz] = label);
  }
  const tzCity = tz => tz.split('/').pop().replace(/_/g, ' ');
  const tzRegion = tz => tz.includes('/') ? tz.split('/')[0].replace(/_/g, ' ') : '';

  // Given "2026-03-29", "23:00", "America/New_York" → the UTC instant when it's 11PM in NY
  function wallClockToUTC(dateStr, timeStr, tz) {
    const [y, mo, d] = dateStr.split('-').map(Number);
    const [h, mi] = timeStr.split(':').map(Number);
    // Use the target date itself as the reference point (handles DST correctly)
    const refUTC = Date.UTC(y, mo - 1, d, h, mi);
    let tzParts;
    try {
      tzParts = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
      }).formatToParts(new Date(refUTC));
    } catch (e) { return new Date(refUTC); }
    const get = (type) => parseInt(tzParts.find(p => p.type === type).value);
    const tzWall = Date.UTC(get('year'), get('month') - 1, get('day'), get('hour') === 24 ? 0 : get('hour'), get('minute'), get('second'));
    return new Date(refUTC + (refUTC - tzWall));
  }

  function safeTz(tz) {
    try { new Intl.DateTimeFormat('en-US', { timeZone: tz }); return tz; } catch (e) { return DETECTED_TZ; }
  }

  function fmtMoment(date, tz, long) {
    return new Intl.DateTimeFormat('en-US', long
      ? { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tz, timeZoneName: 'short' }
      : { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit', timeZone: tz, timeZoneName: 'short' }
    ).format(date);
  }

  function calcDiff(target) {
    let diff = target - Date.now();
    if (diff <= 0) return null;
    const d = Math.floor(diff / 86400000); diff -= d * 86400000;
    const h = Math.floor(diff / 3600000); diff -= h * 3600000;
    const m = Math.floor(diff / 60000); diff -= m * 60000;
    const s = Math.floor(diff / 1000);
    return { d, h, m, s, total: d * 86400 + h * 3600 + m * 60 + s };
  }
  const pad = n => String(n).padStart(2, '0');

  // ---- STATE ----
  const tomorrow = new Date(); tomorrow.setDate(tomorrow.getDate() + 1);
  const state = {
    emoji: EMOJIS[0],
    theme: 'auto',
    tz: DETECTED_TZ,
    y: tomorrow.getFullYear(), mo: tomorrow.getMonth(), d: tomorrow.getDate(),
    hour: 12, min: 0, pm: false,
  };
  let calY = state.y, calM = state.mo;

  const dateStr = () => `${state.y}-${pad(state.mo + 1)}-${pad(state.d)}`;
  const timeStr = () => {
    let h = state.hour % 12;
    if (state.pm) h += 12;
    return `${pad(h)}:${pad(state.min)}`;
  };
  const target = () => wallClockToUTC(dateStr(), timeStr(), state.tz);

  const creatorEl = $('#creator');
  const stageEl = $('#countdown');
  const inpName = $('#inp-name');

  // ---- DATE ----
  const weekdaysEl = $('#cal-weekdays');
  WEEKDAYS.forEach(w => { const s = document.createElement('span'); s.className = 'cal-wd'; s.textContent = w; weekdaysEl.appendChild(s); });

  function renderCalendar(dir) {
    const daysEl = $('#cal-days');
    daysEl.innerHTML = '';
    $('#cal-title').textContent = `${MONTHS[calM]} ${calY}`;
    const now = new Date(); now.setHours(0, 0, 0, 0);
    $('#cal-prev').disabled = calY < now.getFullYear() || (calY === now.getFullYear() && calM <= now.getMonth());

    const first = new Date(calY, calM, 1).getDay();
    const days = new Date(calY, calM + 1, 0).getDate();
    for (let i = 0; i < first; i++) {
      const s = document.createElement('span'); s.className = 'cal-pad'; daysEl.appendChild(s);
    }
    for (let d = 1; d <= days; d++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'cal-day press';
      b.textContent = d;
      const date = new Date(calY, calM, d);
      b.setAttribute('aria-label', date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' }));
      if (date < now) b.disabled = true;
      if (date.getTime() === now.getTime()) b.classList.add('today');
      b.setAttribute('aria-pressed', String(calY === state.y && calM === state.mo && d === state.d));
      b.addEventListener('click', () => {
        state.y = calY; state.mo = calM; state.d = d;
        daysEl.querySelectorAll('.cal-day').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        updateDateValue();
        updatePreview(true);
      });
      daysEl.appendChild(b);
    }
    // The grid moves in the direction you paged, so the next month arrives from where you pointed.
    if (dir && !CD.reduceMotion.matches && daysEl.animate) {
      daysEl.animate(
        [{ transform: `translateX(${dir * 28}px)`, opacity: 0 }, { transform: 'translateX(0)', opacity: 1 }],
        { duration: CD.SPRING.ms, easing: CD.SPRING.easing }
      );
    }
  }
  $('#cal-prev').addEventListener('click', () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCalendar(-1); });
  $('#cal-next').addEventListener('click', () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCalendar(1); });

  function updateDateValue() {
    $('#date-value').textContent = new Date(state.y, state.mo, state.d)
      .toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  // ---- TIME (wheels) ----
  function updateTimeValue() {
    $('#time-value').textContent = `${state.hour}:${pad(state.min)} ${state.pm ? 'PM' : 'AM'}`;
  }
  const whHour = CD.Wheel($('#wh-hour'), {
    count: 12, index: state.hour - 1, label: 'Hour',
    format: i => String(i + 1), valueAt: i => i + 1,
    parse: s => { const n = parseInt(s, 10); return n >= 1 && n <= 12 ? n - 1 : -1; },
    onChange: i => { state.hour = i + 1; updateTimeValue(); updatePreview(true); },
  });
  const whMin = CD.Wheel($('#wh-min'), {
    count: 60, index: state.min, label: 'Minute',
    format: i => pad(i),
    parse: s => { const n = parseInt(s, 10); return n >= 0 && n <= 59 ? n : -1; },
    onChange: i => { state.min = i; updateTimeValue(); updatePreview(true); },
  });
  const whAmPm = CD.Wheel($('#wh-ampm'), {
    count: 2, index: state.pm ? 1 : 0, label: 'AM or PM',
    format: i => (i ? 'PM' : 'AM'), keys: { a: 0, p: 1 },
    onChange: i => { state.pm = i === 1; updateTimeValue(); updatePreview(true); },
  });

  // ---- TIME ZONE ----
  const tzList = $('#tz-list');
  const tzSearch = $('#tz-search');
  const CHECK_SVG = '<svg class="tz-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>';

  function renderTzList(q) {
    q = (q || '').trim().toLowerCase();
    tzList.innerHTML = '';
    const matches = !q ? ALL_TIMEZONES : ALL_TIMEZONES.filter(tz => {
      const key = tz.toLowerCase();
      return key.includes(q) || key.replace(/_/g, ' ').includes(q) || tzOffsetLabel(tz).toLowerCase().includes(q) ||
        (CITY_ALIASES[key] || []).some(alias => alias.includes(q));
    });
    const frag = document.createDocumentFragment();
    matches.slice(0, 120).forEach(tz => {
      const li = document.createElement('li');
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'tz-opt' + (frag.childNodes.length ? ' hairline' : '');
      b.setAttribute('aria-current', String(tz === state.tz));
      const alias = q && (CITY_ALIASES[tz.toLowerCase()] || []).find(a => a.includes(q));
      const city = alias ? alias.replace(/\b\w/g, c => c.toUpperCase()) : tzCity(tz);
      const meta = [alias ? tzCity(tz) : '', tzRegion(tz), tzOffsetLabel(tz)].filter(Boolean).join(' · ');
      b.innerHTML = `<span class="tz-opt-text"><span class="tz-city"></span><span class="tz-meta"></span></span>${CHECK_SVG}`;
      b.querySelector('.tz-city').textContent = city;
      b.querySelector('.tz-meta').textContent = meta;
      b.addEventListener('click', () => {
        state.tz = tz;
        updateTzValue();
        updatePreview(true);
        tzDisclosure.close();
      });
      li.appendChild(b);
      frag.appendChild(li);
    });
    tzList.appendChild(frag);
    if (matches.length > 120) {
      const li = document.createElement('li');
      li.className = 'tz-more';
      li.textContent = `${matches.length - 120} more. Keep typing to narrow it down.`;
      tzList.appendChild(li);
    }
    if (!matches.length) {
      const li = document.createElement('li');
      li.className = 'tz-more';
      li.textContent = 'No matching time zones.';
      tzList.appendChild(li);
    }
  }
  tzSearch.addEventListener('input', () => renderTzList(tzSearch.value));
  tzSearch.addEventListener('keydown', e => { if (e.key === 'Escape') { tzDisclosure.close(); $('#tz-row').focus(); } });

  function updateTzValue() {
    const off = tzOffsetLabel(state.tz);
    $('#tz-value').textContent = tzCity(state.tz);
    $('#tz-foot').textContent = `Counting down to ${tzCity(state.tz)} time${off ? ` (${off})` : ''}. Everyone you share it with counts down to the same moment, wherever they are.`;
  }

  // ---- DISCLOSURES ----
  CD.disclosure($('#date-row'), $('#date-panel'), () => { calY = state.y; calM = state.mo; renderCalendar(0); });
  CD.disclosure($('#time-row'), $('#time-panel'), () => { whHour.refresh(); whMin.refresh(); whAmPm.refresh(); });
  const tzDisclosure = CD.disclosure($('#tz-row'), $('#tz-panel'), () => {
    tzSearch.value = '';
    renderTzList('');
    const cur = tzList.querySelector('[aria-current="true"]');
    if (cur) tzList.scrollTop = cur.parentNode.offsetTop - tzList.clientHeight / 2 + cur.offsetHeight / 2;
  });

  // ---- ICON + THEME ----
  const themes = CD.themePicker($('#swatches'), state.theme, t => { state.theme = t; CD.paintFor(state.theme, state.emoji); });
  themes.setEmoji(state.emoji);
  CD.emojiPicker($('#emoji-grid'), $('#emoji-custom'), EMOJIS, state.emoji, e => {
    state.emoji = e;
    themes.setEmoji(e);
    CD.paintFor(state.theme, e);
    updatePreview(false);
  });


  // ---- PREVIEW ----
  let prevTotal = null;
  function updatePreview(userChange) {
    const name = inpName.value.trim();
    $('#lp-emoji').textContent = state.emoji;
    $('#lp-name').textContent = name || 'Your Event Name';
    $('#lp-name').classList.toggle('placeholder', !name);

    const t = target();
    const diff = calcDiff(t) || { d: 0, h: 0, m: 0, s: 0, total: 0 };
    // Roll in the direction the number actually moved: ticking down, or a later date pushing it up.
    const dir = prevTotal === null ? 0 : Math.sign(diff.total - prevTotal);
    prevTotal = diff.total;
    CD.roll($('#lp-d'), pad(diff.d), dir);
    CD.roll($('#lp-h'), pad(diff.h), dir);
    CD.roll($('#lp-m'), pad(diff.m), dir);
    CD.roll($('#lp-s'), pad(diff.s), dir);

    const past = t <= Date.now();
    $('#lp-caption').textContent = past ? 'That moment has already passed. Pick a later time.' : fmtMoment(t, state.tz, false);
    $('#btn-copy').disabled = past;
    $('#btn-open').disabled = past;
  }
  inpName.addEventListener('input', () => updatePreview(false));
  inpName.addEventListener('keydown', e => { if (e.key === 'Enter') inpName.blur(); });

  function buildShareURL() {
    const name = inpName.value.trim();
    let hash = `t=${encodeURIComponent(dateStr() + 'T' + timeStr())}`;
    hash += `&tz=${encodeURIComponent(state.tz)}`;
    if (name) hash += `&n=${encodeURIComponent(name)}`;
    hash += `&e=${encodeURIComponent(state.emoji)}`;
    if (state.theme !== 'auto') hash += `&bg=${state.theme}`;
    return window.location.origin + window.location.pathname + '#' + hash;
  }

  $('#btn-copy').addEventListener('click', () => CD.copyLink(buildShareURL()));
  $('#btn-open').addEventListener('click', () => { window.location.hash = buildShareURL().split('#')[1]; });

  // ---- COUNTDOWN STAGE ----
  let tickTimer = 0;
  let stageTarget = null;
  let stagePrev = null;

  function plural(n, one, many) { return n === 1 ? one : many; }

  function showCountdown(params) {
    creatorEl.classList.remove('active');
    stageEl.classList.add('active');

    const tz = safeTz(params.tz || DETECTED_TZ);
    const [ds, ts] = params.t.split('T');
    stageTarget = wallClockToUTC(ds, ts || '00:00', tz);
    if (isNaN(stageTarget)) { showCreator(); return; }
    const name = params.n || '';
    const emoji = params.e || '⏰';
    CD.paintFor(params.bg, emoji);

    $('#cd-emoji').textContent = emoji;
    $('#cd-name').textContent = name;
    $('#cd-name').hidden = !name;
    $('#cd-digits').hidden = false;
    $('#cd-cel').hidden = true;
    document.title = name ? `${name} — Clockdown` : 'Clockdown';

    // Context that simplifies: when it is, in its own zone, and in yours if that differs.
    const there = fmtMoment(stageTarget, tz, true);
    const localTz = DETECTED_TZ;
    const hereFmt = new Intl.DateTimeFormat('en-US', { weekday: 'short', hour: 'numeric', minute: '2-digit', timeZone: localTz, timeZoneName: 'short' });
    const thereWall = new Intl.DateTimeFormat('en-US', { dateStyle: 'short', timeStyle: 'short', timeZone: tz }).format(stageTarget);
    const hereWall = new Intl.DateTimeFormat('en-US', { dateStyle: 'short', timeStyle: 'short', timeZone: localTz }).format(stageTarget);
    const cap = $('#cd-caption');
    cap.textContent = there;
    if (thereWall !== hereWall) {
      cap.appendChild(document.createElement('br'));
      cap.appendChild(document.createTextNode(`That's ${hereFmt.format(stageTarget)} where you are.`));
    }
    stagePrev = null;

    clearTimeout(tickTimer);
    if (stageTarget <= Date.now()) { celebrate(false); return; }
    tick();
  }

  function tick() {
    const diff = calcDiff(stageTarget);
    if (!diff) { celebrate(true); return; }
    const dir = stagePrev === null ? 0 : -1;
    stagePrev = diff;
    CD.roll($('#cd-d'), pad(diff.d), dir);
    CD.roll($('#cd-h'), pad(diff.h), dir);
    CD.roll($('#cd-m'), pad(diff.m), dir);
    CD.roll($('#cd-s'), pad(diff.s), dir);
    $('#cd-dl').textContent = plural(diff.d, 'day', 'days');
    $('#cd-hl').textContent = plural(diff.h, 'hour', 'hours');
    $('#cd-ml').textContent = plural(diff.m, 'minute', 'minutes');
    $('#cd-sl').textContent = plural(diff.s, 'second', 'seconds');
    $('#cd-digits').setAttribute('aria-label', `${diff.d} days, ${diff.h} hours, ${diff.m} minutes, ${diff.s} seconds remaining`);
    // Tick on the second boundary, not on a drifting interval.
    tickTimer = setTimeout(tick, 1000 - ((Date.now() - stageTarget.getTime()) % 1000 + 1000) % 1000 + 8);
  }

  function celebrate(live) {
    clearTimeout(tickTimer);
    $('#cd-digits').hidden = true;
    const cel = $('#cd-cel');
    cel.textContent = "It's time!";
    cel.hidden = false;
    if (live) {
      // Visual, haptic and confetti on the same frame.
      if (!CD.reduceMotion.matches && cel.animate) {
        cel.animate(
          [{ transform: 'scale(0.86)', opacity: 0, filter: 'blur(10px)' }, { transform: 'scale(1)', opacity: 1, filter: 'blur(0)' }],
          { duration: CD.SPRING.ms, easing: CD.SPRING.easing }
        );
      }
      CD.haptic([30, 60, 30]);
      CD.confetti();
    } else {
      $('#cd-caption').textContent = 'This moment arrived ' + fmtMoment(stageTarget, DETECTED_TZ, true).replace(/^\w+, /, 'on ') + '.';
    }
  }

  function shareCountdown() {
    const emoji = ($('#cd-emoji').textContent || '⏰').trim();
    const name = $('#cd-name').textContent.trim();
    CD.share(window.location.href, name ? `${emoji} ${name} — counting down on Clockdown` : 'Counting down on Clockdown');
  }

  function goCreator() {
    history.pushState(null, '', window.location.pathname + window.location.search);
    route();
  }
  $('#btn-share').addEventListener('click', shareCountdown);
  $('#btn-home').addEventListener('click', goCreator);
  $('#btn-new').addEventListener('click', goCreator);

  // ---- ROUTING ----
  let previewTimer = 0;
  function showCreator() {
    stageEl.classList.remove('active');
    creatorEl.classList.add('active');
    clearTimeout(tickTimer);
    document.title = "Clockdown — Countdown Timers That Don't Suck";
    CD.paintFor(state.theme, state.emoji);
    whHour.refresh(); whMin.refresh(); whAmPm.refresh();
    updatePreview(false);
  }

  function route() {
    const params = CD.parseHash();
    CD.transition(() => {
      if (params && params.t) showCountdown(params);
      else showCreator();
      window.scrollTo(0, 0);
    });
  }

  function previewLoop() {
    if (creatorEl.classList.contains('active')) updatePreview(false);
    previewTimer = setTimeout(previewLoop, 1000 - (Date.now() % 1000) + 8);
  }

  updateDateValue();
  updateTimeValue();
  updateTzValue();
  CD.scrollEdge($('#bar'));
  CD.miniPreview($('#bar'), $('#preview'), -1);
  window.addEventListener('hashchange', route);
  route();
  previewLoop();
})();
</script>
</body>
</html>
