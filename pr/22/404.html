<!DOCTYPE html>
<html lang="en" data-theme="galaxy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-GPPMHQSYHJ"></script>

  function gtag(){dataLayer.push(arguments);}

<title>404 — Clockdown</title>
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
/* ============================================================
   DESIGN SYSTEM
   System type, adaptive light/dark colour, translucent materials,
   spring easing. Shared by every page (inlined, no build step).
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Counter colours are registered so a change cross-fades instead of snapping.
   JS paints them from the counter's emoji (or a chosen theme); see CD.paint(). */
@property --w1     { syntax: '<color>'; inherits: true; initial-value: #8e8e93; }
@property --w2     { syntax: '<color>'; inherits: true; initial-value: #aeaeb2; }
@property --tint-l { syntax: '<color>'; inherits: true; initial-value: #3a3a3c; }
@property --tint-d { syntax: '<color>'; inherits: true; initial-value: #d1d1d6; }

:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;

  /* Light appearance */
  --bg: #f2f2f7;
  --bg-2: #ffffff;
  --bg-3: #ffffff;
  --fill: rgba(120,120,128,0.12);
  --fill-2: rgba(120,120,128,0.2);
  --label: #000000;
  --label-2: rgba(60,60,67,0.62);
  --label-3: rgba(60,60,67,0.32);
  --sep: rgba(60,60,67,0.29);
  --material: rgba(246,246,250,0.74);
  --material-solid: #f6f6fa;
  --edge: rgba(255,255,255,0.75);
  --seg-thumb: #ffffff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 1px 3px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.08);
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --wash-a: 30%;
  --wash-b: 20%;

  /* Two colour roles, kept apart on purpose:
     ink   = every control (buttons, selection, focus). Neutral, so it never competes.
     tint  = the counter's own colour, used only on the counter and its preview. */
  --ink: #000000;
  --on-ink: #ffffff;
  --accent: var(--ink);
  --on-accent: var(--on-ink);
  --tint: var(--tint-l);

  /* Springs. JS replaces these with CSS linear() curves sampled from a real
     critically damped spring (damping 1.0); these cubic-béziers are the fallback. */
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur: 520ms;
  --ease-fast: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur-fast: 380ms;

  transition: --w1 600ms ease, --w2 600ms ease, --tint-l 450ms ease, --tint-d 450ms ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-2: #1c1c1e;
    --bg-3: #2c2c2e;
    --fill: rgba(118,118,128,0.24);
    --fill-2: rgba(118,118,128,0.36);
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.62);
    --label-3: rgba(235,235,245,0.32);
    --sep: rgba(84,84,88,0.65);
    --material: rgba(24,24,27,0.72);
    --material-solid: #18181b;
    --edge: rgba(255,255,255,0.09);
    --seg-thumb: #636366;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 1px 3px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --wash-a: 36%;
    --wash-b: 24%;
    --ink: #ffffff;
    --on-ink: #000000;
    --tint: var(--tint-d);
  }
}

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Body: system font, comfortable leading, tracking near zero. */
body {
  font: 400 1.0625rem/1.47 var(--font);
  letter-spacing: -0.01em;
  color: var(--label);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  overflow-x: hidden;
  transition: background-color 400ms ease, color 400ms ease;
}


a { color: var(--accent); text-decoration: none; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Everything pressable: feedback lands on pointer-down, instantly. */
.press {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform var(--dur-fast) var(--ease), background-color 200ms ease, color 200ms ease, opacity 200ms ease, box-shadow 200ms ease;
}
.press:active:not(:disabled) {
  transform: scale(0.97);
  transition: transform 100ms ease-out, background-color 100ms ease-out;
}

/* ---- Navigation bar: a translucent layer that content scrolls under ---- */
.bar {
  position: sticky;
  top: 0;
  z-index: 50;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
/* Scroll-edge effect: no hard divider. The material fades in 1:1 with scroll,
   and its bottom edge is a soft mask instead of a 1px line. */
.bar::before {
  content: "";
  position: absolute;
  inset: 0 0 -14px;
  z-index: -1;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  opacity: var(--edge-p, 0);
}

/* Segmented control. Specific labels, current page marked. */
.seg {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 2px;
  border-radius: 10px;
  background: var(--fill);
  width: min(100%, 22rem);
}
.seg a {
  position: relative;
  display: block;
  padding: 0.4375rem 0.625rem;
  border-radius: 8px;
  color: var(--label);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.003em;
  text-align: center;
  white-space: nowrap;
}
.seg a[aria-current="page"] {
  background: var(--seg-thumb);
  box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04), inset 0 0 0 0.5px rgba(0,0,0,0.04);
}
.seg a:not([aria-current]):active { background: var(--fill); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 3.125rem;
  padding: 0 1.375rem;
  border-radius: 999px;
  background: var(--fill);
  color: var(--accent);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.012em;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn svg { width: 1.125em; height: 1.125em; flex-shrink: 0; }
@media (hover: hover) {
  .btn:not(.btn-primary):not(:disabled):hover { background: var(--fill-2); }
  .btn-primary:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 88%, var(--label)); }
}

/* Floating pill: lighter material for interactive chrome.
   Vibrancy rule: heavier weight + a hair more tracking on translucent surfaces. */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 2.5rem;
  padding: 0 1rem;
  border-radius: 999px;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 0 0 0.5px var(--edge), var(--shadow-sm);
  color: var(--label);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0;
}
.pill svg { width: 1.0625rem; height: 1.0625rem; }
.wordmark-pill { font-family: var(--font-round); font-weight: 700; letter-spacing: -0.02em; }

.wordmark {
  font-family: var(--font-round);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--label);
}

/* ---- Accessibility: transparency, contrast ---- */
@media (prefers-reduced-transparency: reduce) {
  .bar::before, .pill, .toast, .actions::before {
    background: var(--material-solid) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}
@media (prefers-contrast: more) {
  :root { --label-2: color-mix(in srgb, var(--label) 82%, transparent); --sep: var(--label-3); }
  .bar::before, .pill, .toast, .actions::before { background: var(--material-solid) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .pill, .btn, .seg, .group, .card { box-shadow: inset 0 0 0 1px var(--label-3) !important; }
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 24px 20px calc(env(safe-area-inset-bottom) + 24px);
}
.emoji { font-size: 3.5rem; line-height: 1.1; margin-bottom: 8px; }
.code {
  font-family: var(--font-round);
  font-size: clamp(5rem, 24vw, 9rem);
  font-weight: 700;
  line-height: 1;
  letter-spacing: -0.05em;
  font-variant-numeric: tabular-nums;
}
.message {
  margin: 10px 0 32px;
  color: var(--label-2);
  font-size: 1.1875rem;
  line-height: 1.4;
  letter-spacing: -0.014em;
}
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
</style>
</head>
<body>
<main>
  <div class="emoji" aria-hidden="true">⏳</div>
  <h1 class="code">404</h1>
  <p class="message">This timer doesn't exist yet.</p>
  <div class="links">
    <a class="btn btn-primary press" href="/">Create one</a>
  </div>
</main>
<script>document.addEventListener('touchstart', function () {}, { passive: true });</script>
</body>
</html>
