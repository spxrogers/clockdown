<style>
/* ============================================================
   DESIGN SYSTEM
   System type, adaptive light/dark colour, translucent materials,
   spring easing. Shared by every page (inlined, no build step).
   ============================================================ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* Theme colours are registered so a theme change cross-fades instead of snapping. */
@property --a-l { syntax: '<color>'; inherits: true; initial-value: #a548d6; }
@property --a-d { syntax: '<color>'; inherits: true; initial-value: #bf5af2; }
@property --w1  { syntax: '<color>'; inherits: true; initial-value: #bf5af2; }
@property --w2  { syntax: '<color>'; inherits: true; initial-value: #ff375f; }

:root {
  color-scheme: light dark;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif;

  /* Light appearance */
  --bg: #f2f2f7;
  --bg-2: #ffffff;
  --bg-3: #ffffff;
  --fill: rgba(120,120,128,0.12);
  --fill-2: rgba(120,120,128,0.2);
  --label: #000000;
  --label-2: rgba(60,60,67,0.62);
  --label-3: rgba(60,60,67,0.32);
  --sep: rgba(60,60,67,0.29);
  --material: rgba(246,246,250,0.74);
  --material-solid: #f6f6fa;
  --edge: rgba(255,255,255,0.75);
  --seg-thumb: #ffffff;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --shadow-lg: 0 1px 3px rgba(0,0,0,0.04), 0 12px 32px rgba(0,0,0,0.08);
  --green: #34c759;
  --orange: #ff9500;
  --red: #ff3b30;
  --wash-a: 22%;
  --wash-b: 15%;

  /* Theme: galaxy (default) */
  --a-l: #a548d6; --a-d: #bf5af2;
  --on-a-l: #ffffff; --on-a-d: #ffffff;
  --w1: #bf5af2; --w2: #ff375f;
  --accent: var(--a-l);
  --on-accent: var(--on-a-l);

  /* Springs. JS replaces these with CSS linear() curves sampled from a real
     critically damped spring (damping 1.0); these cubic-béziers are the fallback. */
  --ease: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur: 520ms;
  --ease-fast: cubic-bezier(0.2, 0.9, 0.25, 1);
  --dur-fast: 380ms;

  transition: --a-l 450ms ease, --a-d 450ms ease, --w1 600ms ease, --w2 600ms ease;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #000000;
    --bg-2: #1c1c1e;
    --bg-3: #2c2c2e;
    --fill: rgba(118,118,128,0.24);
    --fill-2: rgba(118,118,128,0.36);
    --label: #ffffff;
    --label-2: rgba(235,235,245,0.62);
    --label-3: rgba(235,235,245,0.32);
    --sep: rgba(84,84,88,0.65);
    --material: rgba(24,24,27,0.72);
    --material-solid: #18181b;
    --edge: rgba(255,255,255,0.09);
    --seg-thumb: #636366;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.3);
    --shadow-lg: 0 1px 3px rgba(0,0,0,0.3), 0 16px 40px rgba(0,0,0,0.45);
    --green: #30d158;
    --orange: #ff9f0a;
    --red: #ff453a;
    --wash-a: 30%;
    --wash-b: 20%;
    --accent: var(--a-d);
    --on-accent: var(--on-a-d);
  }
}

[data-theme="sunset"]  { --a-l: #d2500a; --a-d: #ff9f0a; --on-a-l: #fff; --on-a-d: #1f0d00; --w1: #ff9500; --w2: #ff3b30; }
[data-theme="ocean"]   { --a-l: #007aff; --a-d: #0a84ff; --on-a-l: #fff; --on-a-d: #fff;    --w1: #0a84ff; --w2: #30d1c8; }
[data-theme="neon"]    { --a-l: #4a8a00; --a-d: #b4f03c; --on-a-l: #fff; --on-a-d: #102000; --w1: #a3e635; --w2: #ffcc00; }
[data-theme="minimal"] { --a-l: #1c1c1e; --a-d: #f2f2f7; --on-a-l: #fff; --on-a-d: #000;    --w1: #8e8e93; --w2: #aeaeb2; }

html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}

/* Body: system font, comfortable leading, tracking near zero. */
body {
  font: 400 1.0625rem/1.47 var(--font);
  letter-spacing: -0.01em;
  color: var(--label);
  background: var(--bg);
  min-height: 100vh;
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-optical-sizing: auto;
  overflow-x: hidden;
  transition: background-color 400ms ease, color 400ms ease;
}

/* Ambient theme wash. Static: no full-viewport motion, no slow looping oscillation. */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  pointer-events: none;
  background:
    radial-gradient(90% 60% at 8% -8%, color-mix(in srgb, var(--w1) var(--wash-a), transparent), transparent 72%),
    radial-gradient(80% 55% at 100% 6%, color-mix(in srgb, var(--w2) var(--wash-b), transparent), transparent 72%);
}

a { color: var(--accent); text-decoration: none; }
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; background: none; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* Everything pressable: feedback lands on pointer-down, instantly. */
.press {
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
  transition: transform var(--dur-fast) var(--ease), background-color 200ms ease, color 200ms ease, opacity 200ms ease, box-shadow 200ms ease;
}
.press:active:not(:disabled) {
  transform: scale(0.97);
  transition: transform 100ms ease-out, background-color 100ms ease-out;
}

/* ---- Navigation bar: a translucent layer that content scrolls under ---- */
.bar {
  position: sticky;
  top: 0;
  z-index: 50;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
}
/* Scroll-edge effect: no hard divider. The material fades in 1:1 with scroll,
   and its bottom edge is a soft mask instead of a 1px line. */
.bar::before {
  content: "";
  position: absolute;
  inset: 0 0 -14px;
  z-index: -1;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  -webkit-mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  mask-image: linear-gradient(to bottom, #000 calc(100% - 14px), transparent);
  opacity: var(--edge-p, 0);
}

/* Segmented control. Specific labels, current page marked. */
.seg {
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  padding: 2px;
  border-radius: 10px;
  background: var(--fill);
  width: min(100%, 22rem);
}
.seg a {
  position: relative;
  display: block;
  padding: 0.4375rem 0.625rem;
  border-radius: 8px;
  color: var(--label);
  font-size: 0.8125rem;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.003em;
  text-align: center;
  white-space: nowrap;
}
.seg a[aria-current="page"] {
  background: var(--seg-thumb);
  box-shadow: 0 3px 8px rgba(0,0,0,0.12), 0 3px 1px rgba(0,0,0,0.04), inset 0 0 0 0.5px rgba(0,0,0,0.04);
}
.seg a:not([aria-current]):active { background: var(--fill); }

/* ---- Buttons ---- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 3.125rem;
  padding: 0 1.375rem;
  border-radius: 999px;
  background: var(--fill);
  color: var(--accent);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.012em;
  white-space: nowrap;
}
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn:disabled { opacity: 0.38; cursor: default; }
.btn svg { width: 1.125em; height: 1.125em; flex-shrink: 0; }
@media (hover: hover) {
  .btn:not(.btn-primary):not(:disabled):hover { background: var(--fill-2); }
  .btn-primary:not(:disabled):hover { background: color-mix(in srgb, var(--accent) 88%, var(--label)); }
}

/* Floating pill: lighter material for interactive chrome.
   Vibrancy rule: heavier weight + a hair more tracking on translucent surfaces. */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 2.5rem;
  padding: 0 1rem;
  border-radius: 999px;
  background: var(--material);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  box-shadow: inset 0 0 0 0.5px var(--edge), var(--shadow-sm);
  color: var(--label);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: 0;
}
.pill svg { width: 1.0625rem; height: 1.0625rem; }
.wordmark-pill { font-family: var(--font-round); font-weight: 700; letter-spacing: -0.02em; }

.wordmark {
  font-family: var(--font-round);
  font-weight: 700;
  letter-spacing: -0.03em;
  color: var(--label);
}

/* ---- Accessibility: transparency, contrast ---- */
@media (prefers-reduced-transparency: reduce) {
  .bar::before, .pill, .toast, .actions::before {
    background: var(--material-solid) !important;
    -webkit-backdrop-filter: none !important;
    backdrop-filter: none !important;
  }
}
@media (prefers-contrast: more) {
  :root { --label-2: color-mix(in srgb, var(--label) 82%, transparent); --sep: var(--label-3); }
  .bar::before, .pill, .toast, .actions::before { background: var(--material-solid) !important; backdrop-filter: none !important; -webkit-backdrop-filter: none !important; }
  .pill, .btn, .seg, .group, .card { box-shadow: inset 0 0 0 1px var(--label-3) !important; }
}
/* ============================================================
   CREATOR + COUNTER COMPONENTS
   ============================================================ */
[hidden] { display: none !important; }

/* ---- Creator layout ---- */
#creator { display: none; }
#creator.active { display: block; }

.creator {
  width: 100%;
  max-width: 34rem;
  margin: 0 auto;
  padding: 4px 16px calc(env(safe-area-inset-bottom) + 112px);
}
.hero { display: flex; flex-direction: column; gap: 20px; }
.masthead { padding: 8px 4px 0; }
.masthead .wordmark { font-size: 2.125rem; line-height: 1.1; }
.tagline { margin-top: 2px; color: var(--label-2); font-size: 0.9375rem; line-height: 1.35; letter-spacing: -0.006em; }

@media (min-width: 920px) {
  .creator {
    max-width: 66rem;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 27rem;
    gap: 48px;
    align-items: start;
    padding: 12px 32px 64px;
  }
  .hero {
    position: sticky;
    top: 68px;
    min-height: calc(100vh - 96px);
    justify-content: center;
    gap: 24px;
  }
  .masthead .wordmark { font-size: 2.75rem; }
  .form { padding-top: 8px; }
}

/* ---- Preview card: a miniature of the shared page ---- */
.card {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border-radius: 24px;
  background: var(--bg-2);
  box-shadow: var(--shadow-lg);
  padding: 22px 16px 22px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  text-align: center;
  view-transition-name: stage;
}
.card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(90% 75% at 0% 0%, color-mix(in srgb, var(--w1) var(--wash-a), transparent), transparent 75%),
    radial-gradient(80% 70% at 100% 100%, color-mix(in srgb, var(--w2) var(--wash-b), transparent), transparent 75%);
}
.card-eyebrow {
  font-size: 0.6875rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--label-2);
}
.card-emoji { font-size: 2.75rem; line-height: 1.15; margin-top: 4px; view-transition-name: v-emoji; }
.card-title {
  max-width: 100%;
  font-size: 1.375rem;
  font-weight: 700;
  line-height: 1.2;
  letter-spacing: -0.02em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  view-transition-name: v-title;
}
.card-title.placeholder { color: var(--label-3); }
.card-caption { font-size: 0.8125rem; line-height: 1.38; color: var(--label-2); letter-spacing: 0; font-variant-numeric: tabular-nums; }
@media (min-width: 920px) {
  .card { padding: 40px 28px 36px; gap: 12px; border-radius: 32px; }
  .card-emoji { font-size: 3.5rem; }
  .card-title { font-size: 2rem; letter-spacing: -0.025em; }
  .card-caption { font-size: 0.9375rem; }
}

/* ---- Numerals ---- */
.digits { display: flex; justify-content: center; align-items: flex-start; view-transition-name: v-digits; }
.unit { display: flex; flex-direction: column; align-items: center; }
.num {
  font-family: var(--font-round);
  font-weight: 600;
  line-height: 1;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  white-space: nowrap;
}
.unit-label {
  margin-top: 4px;
  font-size: 0.75rem;
  font-weight: 500;
  letter-spacing: 0.01em;
  color: var(--label-2);
}
.card .digits { gap: clamp(12px, 4.5vw, 28px); margin: 4px 0 2px; }
.card .num { font-size: clamp(2.25rem, 10.5vw, 3.25rem); }
@media (min-width: 920px) { .card .num { font-size: 4rem; } .card .digits { gap: 32px; } }

/* Rolling digits (a numeric content transition). Each glyph has a slot;
   a change rolls the old glyph out and the new one in, in the direction of counting. */
.dg { display: inline-block; position: relative; }
.dg > span { display: inline-block; }
.dg > .dg-out { position: absolute; left: 0; top: 0; }

/* ---- Inset grouped form ---- */
.form { display: flex; flex-direction: column; }
.group-title {
  margin: 26px 0 0;
  padding: 0 16px 7px;
  font-size: 0.8125rem;
  font-weight: 400;
  line-height: 1.38;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--label-2);
}
.form > .group:first-child { margin-top: 24px; }
@media (min-width: 920px) { .form > .group:first-child { margin-top: 0; } }
.group-foot {
  padding: 7px 16px 0;
  font-size: 0.8125rem;
  line-height: 1.38;
  letter-spacing: 0;
  color: var(--label-2);
}
.group {
  background: var(--bg-2);
  border-radius: 14px;
  overflow: hidden;
}
.row {
  position: relative;
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  min-height: 2.875rem;
  padding: 0.5rem 16px;
  text-align: left;
  color: var(--label);
}
button.row:active { background: var(--fill); }
.group > .row:not(:first-child)::before,
.hairline::before {
  content: "";
  position: absolute;
  top: 0; left: 16px; right: 0;
  height: 1px;
  background: var(--sep);
  transform-origin: top;
}
@media (min-resolution: 2dppx) {
  .group > .row:not(:first-child)::before, .hairline::before { transform: scaleY(0.5); }
}
.row-label { flex: 1; min-width: 0; }
.row-input {
  flex: 1;
  min-width: 0;
  border: 0;
  background: none;
  outline: none;
  font-size: 1.0625rem;
  color: var(--label);
}
.row-input::placeholder { color: var(--label-3); }
.row-value {
  flex-shrink: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  padding: 0.375rem 0.6875rem;
  border-radius: 8px;
  background: var(--fill);
  font-variant-numeric: tabular-nums;
  transition: color 200ms ease;
}
.row[aria-expanded="true"] .row-value { color: var(--accent); }

/* Inline disclosure: the row grows open in place, and closes back the same way.
   CSS transitions retarget from the current value, so it can be reversed mid-flight. */
.expand {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows var(--dur) var(--ease);
}
.expand.open { grid-template-rows: 1fr; }
.expand-inner {
  position: relative;
  min-height: 0;
  overflow: hidden;
  opacity: 0;
  transition: opacity 240ms ease;
}
.expand.open .expand-inner { opacity: 1; transition-delay: 40ms; }

/* ---- Calendar ---- */
.cal { padding: 6px 10px 12px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 4px 2px 4px 10px; }
.cal-title { font-size: 1.0625rem; font-weight: 600; letter-spacing: -0.012em; }
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 999px;
  color: var(--accent);
}
.icon-btn:active { background: var(--fill); }
.icon-btn:disabled { color: var(--label-3); }
.icon-btn svg { width: 1.25rem; height: 1.25rem; }
.cal-nav { display: flex; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); row-gap: 2px; text-align: center; }
.cal-wd {
  padding: 6px 0 4px;
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.02em;
  text-transform: uppercase;
  color: var(--label-3);
}
.cal-day {
  justify-self: center;
  width: min(2.75rem, 100%);
  aspect-ratio: 1;
  border-radius: 999px;
  font-size: 1.125rem;
  line-height: 1;
  letter-spacing: 0;
  font-variant-numeric: tabular-nums;
  color: var(--label);
}
.cal-day.today { color: var(--accent); font-weight: 600; }
.cal-day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
.cal-day:disabled { color: var(--label-3); cursor: default; }
.cal-day:not(:disabled):not([aria-pressed="true"]):active { background: var(--fill); }
.cal-pad { visibility: hidden; }

/* ---- Wheel picker ---- */
.wheels {
  --item-h: 2.25rem;
  position: relative;
  display: flex;
  justify-content: center;
  gap: 2px;
  padding: 10px 12px;
}
.wheels::before {
  content: "";
  position: absolute;
  left: 12px; right: 12px; top: 50%;
  height: var(--item-h);
  transform: translateY(-50%);
  border-radius: 10px;
  background: var(--fill);
  pointer-events: none;
}
.wheel {
  position: relative;
  width: 4.5rem;
  height: calc(var(--item-h) * 5.4);
  perspective: 900px;
  touch-action: none;
  cursor: grab;
  -webkit-user-select: none;
  user-select: none;
  outline: none;
  -webkit-mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(to bottom, transparent, #000 30%, #000 70%, transparent);
}
.wheel.dragging { cursor: grabbing; }
.wheel.has-unit { width: 6.25rem; }
.wheel-item {
  position: absolute;
  left: 0; right: 0; top: 50%;
  height: var(--item-h);
  margin-top: calc(var(--item-h) / -2);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.375rem;
  line-height: 1;
  letter-spacing: -0.01em;
  font-variant-numeric: tabular-nums;
  color: var(--label-2);
  backface-visibility: hidden;
  visibility: hidden;
}
.wheel-item.on { color: var(--label); }
.wheel.has-unit .wheel-item { justify-content: flex-end; padding-right: 3.125rem; }
.wheel-unit {
  position: absolute;
  top: 50%;
  left: calc(100% - 2.875rem);
  transform: translateY(-50%);
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  pointer-events: none;
}
.wheel:focus-visible::after {
  content: "";
  position: absolute;
  left: 2px; right: 2px; top: 50%;
  height: var(--item-h);
  transform: translateY(-50%);
  border-radius: 10px;
  box-shadow: inset 0 0 0 2px var(--accent);
  pointer-events: none;
}

/* ---- Chips (presets) ---- */
.chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 4px 16px 16px; }
.chip {
  padding: 0.4375rem 0.875rem;
  border-radius: 999px;
  background: var(--fill);
  font-size: 0.9375rem;
  font-weight: 500;
  letter-spacing: -0.006em;
  color: var(--label);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

/* ---- Time zone list ---- */
.tz-search-wrap { padding: 10px 12px 6px; }
.search {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 2.25rem;
  padding: 0 10px;
  border-radius: 10px;
  background: var(--fill);
  color: var(--label-2);
}
.search svg { width: 1rem; height: 1rem; flex-shrink: 0; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 1.0625rem; color: var(--label); }
.search input::placeholder { color: var(--label-2); }
.tz-list {
  list-style: none;
  max-height: 16.5rem;
  overflow-y: auto;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}
.tz-opt { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 2.75rem; padding: 0.5rem 16px; text-align: left; }
.tz-opt:active { background: var(--fill); }
.tz-opt-text { flex: 1; min-width: 0; }
.tz-city { display: block; font-size: 1.0625rem; line-height: 1.3; }

.tz-check { width: 1.125rem; height: 1.125rem; color: var(--accent); visibility: hidden; }
.tz-opt[aria-current="true"] .tz-check { visibility: visible; }
.tz-more { padding: 10px 16px 14px; font-size: 0.8125rem; color: var(--label-2); }

/* ---- Icon grid ---- */
.emoji-grid {
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  gap: 4px;
  padding: 10px;
}
@media (max-width: 359px) { .emoji-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.emoji-btn {
  aspect-ratio: 1;
  min-height: 2.5rem;
  border-radius: 12px;
  font-size: 1.5rem;
  line-height: 1;
}
.emoji-btn[aria-pressed="true"] {
  background: color-mix(in srgb, var(--accent) 18%, transparent);
  box-shadow: inset 0 0 0 2px var(--accent);
}
.emoji-btn:not([aria-pressed="true"]):active { background: var(--fill); }
.emoji-custom { border: 0; outline: none; color: var(--label); width: 4.5rem; flex: none; text-align: center; padding: 0.3125rem 0; border-radius: 8px; background: var(--fill); font-size: 1.25rem; }

/* ---- Theme swatches ---- */
.swatches { display: flex; justify-content: space-between; gap: 4px; padding: 16px 14px 12px; }
.swatch { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 3.25rem; }
.swatch-dot {
  width: 2.5rem;
  height: 2.5rem;
  border-radius: 999px;
  transition: box-shadow 200ms ease;
}
.swatch[aria-pressed="true"] .swatch-dot { box-shadow: 0 0 0 3px var(--bg-2), 0 0 0 5px var(--accent); }
.swatch-label { font-size: 0.75rem; font-weight: 500; letter-spacing: 0.01em; color: var(--label-2); }
.swatch[aria-pressed="true"] .swatch-label { color: var(--label); font-weight: 600; }
.swatch-dot[data-t="galaxy"]  { background: linear-gradient(135deg, #bf5af2, #ff375f); }
.swatch-dot[data-t="sunset"]  { background: linear-gradient(135deg, #ffb340, #ff453a); }
.swatch-dot[data-t="ocean"]   { background: linear-gradient(135deg, #0a84ff, #30d1c8); }
.swatch-dot[data-t="neon"]    { background: linear-gradient(135deg, #b4f03c, #ffcc00); }
.swatch-dot[data-t="minimal"] { background: linear-gradient(135deg, #636366, #d1d1d6); }

/* ---- Footer ---- */
.foot {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-top: 32px;
  font-size: 0.8125rem;
  letter-spacing: 0;
  color: var(--label-2);
}
.foot a { color: var(--label); font-weight: 600; }
.gh-link {
  display: inline-grid;
  place-items: center;
  width: 2.25rem;
  height: 2.25rem;
  border-radius: 999px;
  background: var(--fill);
  color: var(--label-2) !important;
}
.gh-link svg { width: 1.0625rem; height: 1.0625rem; fill: currentColor; }

/* ---- Primary actions ----
   Desktop: right under the preview they act on. Phone: a floating toolbar. */
.actions { display: flex; gap: 10px; }
.actions .btn { flex: 1; }
@media (max-width: 919px) {
  .actions {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    z-index: 40;
    isolation: isolate;
    padding: 10px max(16px, env(safe-area-inset-left)) calc(env(safe-area-inset-bottom) + 12px);
  }
  .actions::before {
    content: "";
    position: absolute;
    inset: -18px 0 0;
    z-index: -1;
    background: var(--material);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-mask-image: linear-gradient(to top, #000 calc(100% - 18px), transparent);
    mask-image: linear-gradient(to top, #000 calc(100% - 18px), transparent);
  }
  .actions > * { position: relative; max-width: 32rem; }
  .actions { justify-content: center; }
}

/* ---- Toast: materialises from the toolbar it came from, leaves the same way ---- */
.toast {
  position: fixed;
  left: 50%;
  bottom: calc(env(safe-area-inset-bottom) + 92px);
  z-index: 100;
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0.75rem 1.125rem;
  border-radius: 999px;
  background: var(--material);

  backdrop-filter: blur(24px) saturate(180%);

  font-weight: 600;
  letter-spacing: 0;
  white-space: nowrap;
  pointer-events: none;

}
.toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); filter: blur(0); }
.toast svg { width: 1.125rem; height: 1.125rem; color: var(--green); }
@media (min-width: 920px) { .toast { bottom: 36px; } }

/* ---- Counter stage (the shared, full-screen page) ---- */
.stage {
  display: none;
  min-height: 100vh;
  min-height: 100dvh;
  flex-direction: column;
  align-items: center;
  padding: calc(env(safe-area-inset-top) + 12px) max(16px, env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 20px) max(16px, env(safe-area-inset-left));
}
.stage.active { display: flex; }
.stage-top {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 72rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.stage-body {
  flex: 1;
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: clamp(10px, 2.2vh, 20px);
  padding: 24px 0;
  text-align: center;
  view-transition-name: stage;
}
.stage-emoji { font-size: clamp(3.25rem, 11vw, 5rem); line-height: 1.1; view-transition-name: v-emoji; }
.stage-title {
  max-width: 22ch;
  font-size: clamp(1.75rem, 6.5vw, 3.25rem);
  font-weight: 700;
  line-height: 1.08;
  letter-spacing: -0.028em;
  text-wrap: balance;
  overflow-wrap: anywhere;
  view-transition-name: v-title;
}
.stage-caption {
  max-width: 34ch;
  font-size: 0.9375rem;
  line-height: 1.45;
  letter-spacing: -0.004em;
  color: var(--label-2);
  font-variant-numeric: tabular-nums;
  text-wrap: balance;
}
.stage-caption strong { color: var(--label); font-weight: 600; }
.stage .digits { gap: clamp(14px, 4.5vw, 48px); margin: 6px 0; }
.stage .num { font-size: clamp(2.75rem, 14vw, 8rem); letter-spacing: -0.035em; }
.stage .unit-label { font-size: clamp(0.75rem, 2.2vw, 0.9375rem); margin-top: 6px; }
.stage-foot { display: flex; justify-content: center; }
.text-btn {
  display: inline-flex;
  align-items: center;
  min-height: 2.75rem;
  padding: 0 14px;
  border-radius: 999px;
  color: var(--accent);
  font-size: 0.9375rem;
  font-weight: 600;
  letter-spacing: -0.006em;

  font-size: clamp(2.5rem, 11vw, 6rem);
  font-weight: 800;
  line-height: 1.02;
  letter-spacing: -0.04em;

}

/* Transport: round controls, the way a stopwatch has always worked.
   Secondary on the left, primary on the right. */
.transport {
  width: 100%;
  max-width: 21rem;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.round {
  --tint: var(--label);
  position: relative;
  width: 5.25rem;
  height: 5.25rem;
  border-radius: 999px;
  display: grid;
  place-items: center;
  font-size: 1.0625rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--tint);
  background: color-mix(in srgb, var(--tint) 18%, transparent);
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px color-mix(in srgb, var(--tint) 18%, transparent);

.round.neutral { --tint: var(--label); background: var(--fill-2); box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--fill-2); }
.round.go { --tint: var(--green); }
.round.pause { --tint: var(--orange); }
.round.stop { --tint: var(--red); }
.round:disabled { opacity: 0.45; cursor: default; }

/* Timer ring */
.ring-wrap {
  position: relative;
  width: min(80vw, 21rem, 52vh);
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  view-transition-name: v-digits;
}
.ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .track { stroke: var(--fill); }
.ring .prog { stroke: var(--accent); stroke-linecap: round; }
.ring-center { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; }
/* Sized to the ring, not the viewport, so the digits always sit inside it.
   Needs .stage specificity to beat the countdown's `.stage .num` size. */
.ring-wrap { container-type: inline-size; }
.stage .ring-num { font-size: clamp(3rem, 17vw, 5.25rem); font-size: 25cqi; }
.stage .ring-num.long { font-size: clamp(2.5rem, 13vw, 4.25rem); font-size: 19cqi; }
.ring-caption { min-height: 1.4em; font-size: 0.9375rem; font-weight: 500; color: var(--label-2); letter-spacing: -0.004em; font-variant-numeric: tabular-nums; }
.ring-caption.done { color: var(--accent); font-weight: 700; font-size: 1.0625rem; }

/* Stopwatch */
.stage-body.top { justify-content: flex-start; padding-top: clamp(16px, 7vh, 80px); }
.stage .sw-time { font-size: clamp(3.25rem, 17vw, 7.5rem); view-transition-name: v-digits; }
.laps { list-style: none; width: 100%; max-width: 21rem; margin-top: 4px; text-align: left; }
.lap {
  position: relative;
  display: flex;
  align-items: baseline;
  gap: 12px;
  min-height: 2.75rem;
  padding: 0.6875rem 2px;
  font-size: 1.0625rem;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.005em;
}
.lap::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: var(--sep); transform-origin: top;
}
@media (min-resolution: 2dppx) { .lap::before { transform: scaleY(0.5); } }
.lap:last-child::after {
  content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 1px;
  background: var(--sep); transform-origin: bottom;
}
@media (min-resolution: 2dppx) { .lap:last-child::after { transform: scaleY(0.5); } }
.lap-name { flex: 1; }
.lap-total { font-size: 0.8125rem; color: var(--label-3); letter-spacing: 0; }
.lap-split { min-width: 6.5ch; text-align: right; }
.lap.best { color: var(--green); }
.lap.worst { color: var(--red); }
.lap.best .lap-total, .lap.worst .lap-total { color: inherit; opacity: 0.6; }

#confetti { position: fixed; inset: 0; z-index: 60; pointer-events: none; width: 100%; height: 100%; }

/* ---- View transitions: preview card grows into the page, and shrinks back ---- */
::view-transition-group(*) {
  animation-duration: var(--dur);
  animation-timing-function: var(--ease);
}
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 260ms; }
.vt-fade .card, .vt-fade .stage-body, .vt-fade .card *, .vt-fade .stage-body * { view-transition-name: none !important; }

/* ---- Reduced motion: cross-fades instead of slides, springs and scale ---- */
@media (prefers-reduced-motion: reduce) {
  :root { transition: none; }
  .expand { transition: none; }
  .toast { transform: translate(-50%, 0); filter: none; transition: opacity 200ms ease; }
}

<script>
/* ============================================================
   CD — shared interaction + motion toolkit (no dependencies)
   ============================================================ */
const CD = (function () {
  'use strict';

  const root = document.documentElement;
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
  const $ = (s, r) => (r || document).querySelector(s);
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

  // iOS Safari only applies :active while a touch listener exists. Feedback must land on touch-down.

  /* ---------- Springs ----------
     Apple's two designer-facing parameters: damping ratio (1 = no overshoot)
     and response (seconds to reach the target; not a duration).
     stiffness = (2π / response)², damping coefficient = 4π·ζ / response, mass = 1. */
  function springCoeffs(damping, response) {
    return { k: Math.pow(2 * Math.PI / response, 2), c: 4 * Math.PI * damping / response };
  }

  // Sample a spring from 0 → 1 into a CSS linear() easing so time-based CSS/WAAPI
  // animations share exactly the same curve as the gesture-driven springs.
  function springCurve(damping, response) {
    const { k, c } = springCoeffs(damping, response);
    const dt = 1 / 1000;
    let x = 0, v = 0, t = 0;
    const samples = [0];
    while (t < 2) {
      const a = k * (1 - x) - c * v;
      v += a * dt; x += v * dt; t += dt;
      samples.push(x);
      if (Math.abs(1 - x) < 0.002 && Math.abs(v) < 0.02) break;
    }
    const n = 40, pts = [];
    for (let i = 0; i <= n; i++) {
      const s = samples[Math.round((samples.length - 1) * i / n)];
      pts.push(+(i === n ? 1 : s).toFixed(4));
    }
    return { easing: 'linear(' + pts.join(', ') + ')', ms: Math.round(t * 1000) };
  }

  const SPRING = { easing: 'cubic-bezier(0.2, 0.9, 0.25, 1)', ms: 520 };
  const SPRING_FAST = { easing: 'cubic-bezier(0.2, 0.9, 0.25, 1)', ms: 380 };
  if (window.CSS && CSS.supports && CSS.supports('transition-timing-function', 'linear(0, 1)')) {
    Object.assign(SPRING, springCurve(1, 0.42));
    Object.assign(SPRING_FAST, springCurve(1, 0.3));
    root.style.setProperty('--ease', SPRING.easing);
    root.style.setProperty('--dur', SPRING.ms + 'ms');
    root.style.setProperty('--ease-fast', SPRING_FAST.easing);
    root.style.setProperty('--dur-fast', SPRING_FAST.ms + 'ms');
  }

  // Momentum projection, from Apple's Designing Fluid Interfaces sample code.
  function project(velocity, decelerationRate) {
    const d = decelerationRate || 0.998;
    return (velocity / 1000) * d / (1 - d);
  }

  // Progressive resistance past a boundary instead of a hard stop.
  function rubberband(overshoot, dimension, constant) {
    const c = constant || 0.55;
    return (overshoot * dimension * c) / (dimension + c * Math.abs(overshoot));
  }

  /* ---------- Feedback ---------- */
  function haptic(pattern) {
    try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) { /* unsupported */ }
  }

  const CHECK = '<svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="10" fill="currentColor"/><path d="M6 10.4l2.6 2.6L14.2 7.4" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  let toastTimer = 0;
  function toast(msg) {
    const el = $('#toast');
    if (!el) return;
    el.innerHTML = CHECK + '<span></span>';
    el.lastChild.textContent = msg;
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 2200);
  }

  function copyText(text) {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
    return new Promise((resolve, reject) => {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;opacity:0;top:0;left:0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch (e) { reject(e); }
      document.body.removeChild(ta);
    });
  }

  function copyLink(url) {
    copyText(url).then(() => { toast('Link copied'); haptic(8); })
      .catch(() => { window.prompt('Copy this link:', url); });
  }

  // Link unfurlers never receive the #hash, so the preview card in iMessage/Slack/etc
  // is always the generic one. Passing the name as share `text` puts it in the message body.
  function share(url, text) {
    if (navigator.share) {
      navigator.share({ title: document.title, text: text, url: url }).catch(() => {});
    } else {
      copyLink(url);
    }
  }

  /* ---------- Theme ---------- */
  const THEMES = [
    { id: 'galaxy', label: 'Galaxy' },
    { id: 'sunset', label: 'Sunset' },
    { id: 'ocean', label: 'Ocean' },
    { id: 'neon', label: 'Neon' },
    { id: 'minimal', label: 'Minimal' },
  ];
  function applyTheme(id) {
    root.dataset.theme = THEMES.some(t => t.id === id) ? id : 'galaxy';
  }

  /* ---------- Scroll edge: bar material follows scroll 1:1 ---------- */
  function scrollEdge(bar) {
    if (!bar) return;
    let raf = 0;
    const update = () => { raf = 0; bar.style.setProperty('--edge-p', clamp(window.scrollY / 24, 0, 1).toFixed(3)); };
    window.addEventListener('scroll', () => { if (!raf) raf = requestAnimationFrame(update); }, { passive: true });
    update();
  }

  /* ---------- Hash ---------- */
  function parseHash() {
    const hash = window.location.hash.slice(1);
    if (!hash) return null;
    const params = {};
    hash.split('&').forEach(pair => {
      const [k, ...rest] = pair.split('=');
      if (!k || !rest.length) return;
      try { params[k] = decodeURIComponent(rest.join('=')); } catch (e) { params[k] = rest.join('='); }
    });
    return params;
  }

  /* ---------- View transitions ----------
     The preview card grows into the full page and shrinks back along the same path.
     Reduced motion: a plain cross-fade. */
  let firstRoute = true;
  function transition(update) {
    if (firstRoute || !document.startViewTransition) { firstRoute = false; update(); return; }
    root.classList.toggle('vt-fade', reduceMotion.matches);
    const vt = document.startViewTransition(update);
    vt.finished.finally(() => root.classList.remove('vt-fade'));
  }

  /* ---------- Rolling digits ----------
     dir -1: counting down, the new glyph drops in from above.
     dir +1: counting up, it rises from below. 0: no animation. */
  function roll(el, text, dir) {
    const chars = Array.from(String(text));
    let slots = el._slots;
    if (!slots || slots.length !== chars.length) {
      el.textContent = '';
      slots = el._slots = chars.map(ch => {
        const s = document.createElement('span');
        s.className = 'dg';
        const cur = document.createElement('span');
        cur.textContent = ch;
        s.appendChild(cur);
        el.appendChild(s);
        return { s, ch, cur };
      });
      return;
    }
    const animate = dir && !reduceMotion.matches && !document.hidden && typeof el.animate === 'function';
    chars.forEach((ch, i) => {
      const slot = slots[i];
      if (slot.ch === ch) return;
      slot.ch = ch;
      if (!animate) { slot.cur.textContent = ch; return; }
      const old = slot.cur;
      const nu = document.createElement('span');
      nu.textContent = ch;
      old.classList.add('dg-out');
      slot.s.appendChild(nu);
      slot.cur = nu;
      const d = dir > 0 ? 1 : -1;
      old.animate(
        [{ transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' },
         { transform: `translateY(${-d * 42}%)`, opacity: 0, filter: 'blur(3px)' }],
        { duration: 240, easing: 'cubic-bezier(0.3, 0, 0.8, 0.6)', fill: 'forwards' }
      ).onfinish = () => old.remove();
      nu.animate(
        [{ transform: `translateY(${d * 42}%)`, opacity: 0, filter: 'blur(3px)' },
         { transform: 'translateY(0)', opacity: 1, filter: 'blur(0)' }],
        { duration: SPRING_FAST.ms, easing: SPRING_FAST.easing }
      );
    });
  }

  /* ---------- Wheel picker ----------
     1:1 drag (grab offset respected, pointer capture), interruptible at any instant
     (it is caught at its on-screen position), release velocity handed to a critically
     damped spring, landing chosen from the momentum projection, rubber-banded ends. */
  function Wheel(el, opts) {
    const count = opts.count;
    const format = opts.format || (i => String(i));
    const onChange = opts.onChange || (() => {});
    const { k: K, c: C } = springCoeffs(1, 0.42);

    let index = clamp(opts.index || 0, 0, count - 1);
    let p = index;             // position, in items (presentation value)
    let v = 0;                 // velocity, items / second
    let target = p;
    let raf = 0, lastT = 0;
    let H = 36, R = H * 2.4;   // item height / drum radius (px)
    let silent = true;

    el.classList.add('wheel');
    if (opts.unit) el.classList.add('has-unit');
    el.tabIndex = 0;
    el.setAttribute('role', 'spinbutton');
    el.setAttribute('aria-label', opts.label);
    el.setAttribute('aria-valuemin', String(opts.valueAt ? opts.valueAt(0) : 0));
    el.setAttribute('aria-valuemax', String(opts.valueAt ? opts.valueAt(count - 1) : count - 1));

    const items = [];
    for (let i = 0; i < count; i++) {
      const it = document.createElement('div');
      it.className = 'wheel-item';
      it.textContent = format(i);
      it.setAttribute('aria-hidden', 'true');
      el.appendChild(it);
      items.push(it);
    }
    if (opts.unit) {
      const u = document.createElement('span');
      u.className = 'wheel-unit';
      u.textContent = opts.unit;
      u.setAttribute('aria-hidden', 'true');
      el.appendChild(u);
    }

    function measure() {
      const h = items[0].offsetHeight;
      if (h) { H = h; R = H * 2.4; }
    }

    let visLo = 0, visHi = -1;
    function render() {
      const span = Math.ceil((Math.PI / 2) * R / H);
      const lo = clamp(Math.floor(p) - span, 0, count - 1);
      const hi = clamp(Math.ceil(p) + span, 0, count - 1);
      for (let i = visLo; i <= visHi; i++) if (i < lo || i > hi) items[i].style.visibility = 'hidden';
      for (let i = lo; i <= hi; i++) {
        const theta = ((i - p) * H) / R;
        const st = items[i].style;
        if (Math.abs(theta) >= Math.PI / 2) { st.visibility = 'hidden'; continue; }
        const y = R * Math.sin(theta);
        const z = R * (Math.cos(theta) - 1);
        st.transform = `translate3d(0, ${y.toFixed(2)}px, ${z.toFixed(2)}px) rotateX(${(-theta).toFixed(4)}rad)`;
        st.opacity = (1 - Math.abs(theta) / (Math.PI / 2) * 0.7).toFixed(3);
        st.visibility = 'visible';
      }
      visLo = lo; visHi = hi;

      const ci = clamp(Math.round(p), 0, count - 1);
      if (ci !== index || !items[ci].classList.contains('on')) {
        items[index].classList.remove('on');
        items[ci].classList.add('on');
        const changed = ci !== index;
        index = ci;
        el.setAttribute('aria-valuenow', String(opts.valueAt ? opts.valueAt(ci) : ci));
        el.setAttribute('aria-valuetext', opts.valueText ? opts.valueText(ci) : format(ci));
        if (changed && !silent) onChange(ci);
      }
    }

    function step(t) {
      const dt = Math.min(0.05, (t - lastT) / 1000 || 1 / 60);
      lastT = t;
      let rem = dt;
      while (rem > 1e-6) {
        const h = Math.min(rem, 1 / 240);
        const a = -K * (p - target) - C * v;
        v += a * h; p += v * h; rem -= h;
      }
      if (Math.abs(p - target) < 0.002 && Math.abs(v) < 0.05) {
        p = target; v = 0; raf = 0; render(); return;
      }
      render();
      raf = requestAnimationFrame(step);
    }

    function stop() { if (raf) { cancelAnimationFrame(raf); raf = 0; } }

    // Retargeting keeps the current velocity, so a new input never hits a "brick wall".
    function animateTo(i, velocity) {
      target = clamp(Math.round(i), 0, count - 1);
      if (velocity !== undefined) v = velocity;
      if (!raf) { lastT = performance.now(); raf = requestAnimationFrame(step); }
    }

    function setIndex(i, o) {
      o = o || {};
      i = clamp(Math.round(i), 0, count - 1);
      silent = !!o.silent;
      if (o.animate === false || reduceMotion.matches) {
        stop(); p = target = i; v = 0; render();
      } else {
        animateTo(i);
      }
      silent = false;
    }

    /* Pointer: direct manipulation */
    let drag = null;
    el.addEventListener('pointerdown', e => {
      if (e.button !== 0) return;
      measure();
      stop();          // caught mid-flight: it stays exactly where it is on screen
      v = 0;
      target = p;
      try { el.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
      drag = { id: e.pointerId, y0: e.clientY, p0: clamp(p, 0, count - 1), moved: false, hist: [{ p: p, t: e.timeStamp }] };
      el.classList.add('dragging');
    });
    el.addEventListener('pointermove', e => {
      if (!drag || e.pointerId !== drag.id) return;
      const dy = drag.y0 - e.clientY;
      if (Math.abs(dy) > 6) drag.moved = true;
      const raw = drag.p0 + dy / H;
      const max = count - 1, dim = (el.offsetHeight || H * 5) / H;
      p = raw < 0 ? -rubberband(-raw, dim) : raw > max ? max + rubberband(raw - max, dim) : raw;
      drag.hist.push({ p: raw, t: e.timeStamp });
      while (drag.hist.length > 2 && e.timeStamp - drag.hist[0].t > 100) drag.hist.shift();
      render();
    });
    function release(e, cancelled) {
      if (!drag || e.pointerId !== drag.id) return;
      const d = drag;
      drag = null;
      el.classList.remove('dragging');
      if (!d.moved && !cancelled) {
        // Tap on a row: spin it to the centre. Invert the drum projection to find it.
        const r = el.getBoundingClientRect();
        const off = clamp((e.clientY - (r.top + r.height / 2)) / R, -0.999, 0.999);
        animateTo(p + Math.asin(off) * R / H, 0);
        return;
      }
      const last = d.hist[d.hist.length - 1], first = d.hist[0];
      let vel = 0;
      if (e.timeStamp - last.t < 60 && last.t > first.t) vel = (last.p - first.p) / ((last.t - first.t) / 1000);
      // Project where the flick is going (in px, like scroll deceleration), snap to the nearest row there.
      const projected = p + project(vel * H, 0.996) / H;
      animateTo(clamp(Math.round(projected), 0, count - 1), vel);
    }
    el.addEventListener('pointerup', e => release(e, false));
    el.addEventListener('pointercancel', e => release(e, true));

    /* Mouse wheel / trackpad */
    let wheelTimer = 0;
    el.addEventListener('wheel', e => {
      measure();
      const px = e.deltaY * (e.deltaMode === 1 ? H : e.deltaMode === 2 ? H * 5 : 1);
      const atStart = p <= 0.01 && px < 0, atEnd = p >= count - 1.01 && px > 0;
      if (atStart || atEnd) return;   // let the page scroll on
      e.preventDefault();
      const notched = e.deltaMode !== 0 || Math.abs(e.deltaY) >= 50;
      if (notched) {
        animateTo(target + Math.sign(px));
      } else {
        stop(); v = 0;
        p = clamp(p + px / H, 0, count - 1);
        target = p;
        render();
        clearTimeout(wheelTimer);
        wheelTimer = setTimeout(() => animateTo(Math.round(p), 0), 90);
      }
    }, { passive: false });

    /* Keyboard: spinbutton semantics, plus type-to-set */
    let typed = '', typedTimer = 0;
    el.addEventListener('keydown', e => {
      let i = Math.round(target);
      switch (e.key) {
        case 'ArrowUp': i += 1; break;
        case 'ArrowDown': i -= 1; break;
        case 'PageUp': i += 5; break;
        case 'PageDown': i -= 5; break;
        case 'Home': i = 0; break;
        case 'End': i = count - 1; break;
        default:
          if (/^[0-9]$/.test(e.key) && opts.parse) {
            typed = (typed + e.key).slice(-3);
            clearTimeout(typedTimer);
            typedTimer = setTimeout(() => { typed = ''; }, 900);
            let found = opts.parse(typed);
            if (found < 0) { typed = e.key; found = opts.parse(typed); }
            if (found >= 0) { e.preventDefault(); animateTo(found); }
          } else if (opts.keys && opts.keys[e.key.toLowerCase()] !== undefined) {
            e.preventDefault(); animateTo(opts.keys[e.key.toLowerCase()]);
          }
          return;
      }
      e.preventDefault();
      animateTo(i);
    });

    window.addEventListener('resize', () => { measure(); render(); });

    measure();
    render();
    silent = false;

    return {
      el,
      get index() { return index; },
      setIndex,
      refresh() { measure(); render(); },
    };
  }

  /* ---------- Emoji grid + theme swatches (shared by every creator) ---------- */
  function emojiPicker(grid, custom, emojis, initial, onPick) {
    let current = initial;
    const btns = emojis.map(e => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'emoji-btn press';
      b.textContent = e;
      b.setAttribute('aria-label', e);
      b.setAttribute('aria-pressed', String(e === initial));
      b.addEventListener('click', () => {
        current = e;
        custom.value = '';
        btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        onPick(e);
      });
      grid.appendChild(b);
      return b;
    });
    custom.addEventListener('input', () => {
      const val = custom.value.trim();
      current = val || emojis[0];
      btns.forEach(x => x.setAttribute('aria-pressed', String(!val && x.textContent === emojis[0])));
      onPick(current);
    });
  }

  function themePicker(wrap, initial, onPick) {
    const btns = THEMES.map(t => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'swatch press';
      b.setAttribute('aria-pressed', String(t.id === initial));
      b.innerHTML = `<span class="swatch-dot" data-t="${t.id}"></span><span class="swatch-label">${t.label}</span>`;
      b.addEventListener('click', () => {
        btns.forEach(x => x.setAttribute('aria-pressed', String(x === b)));
        applyTheme(t.id);
        onPick(t.id);
      });
      wrap.appendChild(b);
      return b;
    });
  }

  /* ---------- Disclosure rows (only one open at a time per group) ---------- */
  function disclosure(row, panel, onOpen) {
    row.setAttribute('aria-expanded', 'false');
    panel.inert = true;
    const api = {
      open() {
        disclosure.all.forEach(o => { if (o !== api) o.close(); });
        row.setAttribute('aria-expanded', 'true');
        panel.classList.add('open');
        panel.inert = false;
        if (onOpen) onOpen();
      },
      close() {
        row.setAttribute('aria-expanded', 'false');
        panel.classList.remove('open');
        panel.inert = true;
      },
      get isOpen() { return panel.classList.contains('open'); },
    };
    row.addEventListener('click', () => (api.isOpen ? api.close() : api.open()));
    disclosure.all.push(api);
    return api;
  }
  disclosure.all = [];

  /* ---------- Confetti (delight, only once the moment is real) ---------- */
  let confettiOn = false;
  function confetti() {
    if (confettiOn || reduceMotion.matches) return;
    const canvas = $('#confetti');
    if (!canvas) return;
    confettiOn = true;
    const ctx = canvas.getContext('2d');
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    const W = window.innerWidth, Hh = window.innerHeight;
    canvas.width = W * dpr; canvas.height = Hh * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#bf5af2', '#ff375f', '#ff9f0a', '#ffd60a', '#30d158', '#64d2ff', '#0a84ff'];
    const parts = [];
    for (let i = 0; i < 160; i++) {
      // Two bursts from the lower corners, thrown up and in.
      const left = i % 2 === 0;
      const ang = (left ? -60 : -120) + (Math.random() - 0.5) * 40;
      const sp = 9 + Math.random() * 9;
      parts.push({
        x: left ? -10 : W + 10, y: Hh * 0.85,
        vx: Math.cos(ang * Math.PI / 180) * sp, vy: Math.sin(ang * Math.PI / 180) * sp,
        w: 6 + Math.random() * 6, h: 3 + Math.random() * 4,
        rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3,
        c: colors[(Math.random() * colors.length) | 0], life: 1,
      });
    }
    let last = performance.now();
    function draw(t) {
      const f = Math.min(2, (t - last) / 16.67); last = t;
      ctx.clearRect(0, 0, W, Hh);
      let alive = false;
      parts.forEach(q => {
        if (q.life <= 0) return;
        q.vx *= Math.pow(0.985, f); q.vy = q.vy * Math.pow(0.985, f) + 0.32 * f;
        q.x += q.vx * f; q.y += q.vy * f; q.rot += q.vr * f;
        if (q.vy > 0) q.life -= 0.006 * f;
        if (q.y > Hh + 20) q.life = 0;
        if (q.life <= 0) return;
        alive = true;
        ctx.save();
        ctx.translate(q.x, q.y); ctx.rotate(q.rot);
        ctx.globalAlpha = Math.max(0, Math.min(1, q.life * 1.5));
        ctx.fillStyle = q.c;
        ctx.fillRect(-q.w / 2, -q.h / 2 * Math.abs(Math.cos(q.rot * 2)), q.w, q.h);
        ctx.restore();
      });
      if (alive) requestAnimationFrame(draw);
      else { ctx.clearRect(0, 0, W, Hh); confettiOn = false; }
    }
    requestAnimationFrame(draw);
  }

  // A soft two-note chime, synthesised (no audio file). Only used where the user
  // pressed Start themselves, so the audio context is unlocked by their gesture.
  let audio = null;
  function unlockAudio() {
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audio) audio = new AC();
      if (audio.state === 'suspended') audio.resume();
    } catch (e) { /* no audio */ }
  }
  function chime() {
    if (!audio) return;
    try {
      const now = audio.currentTime;
      [[880, 0], [1318.5, 0.18], [880, 0.9], [1318.5, 1.08]].forEach(([f, at]) => {
        const o = audio.createOscillator(), g = audio.createGain();
        o.type = 'sine'; o.frequency.value = f;
        g.gain.setValueAtTime(0, now + at);
        g.gain.linearRampToValueAtTime(0.18, now + at + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, now + at + 0.9);
        o.connect(g).connect(audio.destination);
        o.start(now + at); o.stop(now + at + 1);
      });
    } catch (e) { /* ignore */ }
  }

  const ICON = {
    share: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V2.8M6.6 6 10 2.6 13.4 6"/><path d="M7 8.6H5.5a1.5 1.5 0 0 0-1.5 1.5v6.4a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-6.4a1.5 1.5 0 0 0-1.5-1.5H13"/></svg>',
  };

  return {
    $, clamp, reduceMotion, SPRING, SPRING_FAST,
    haptic, toast, copyLink, share, THEMES, applyTheme, scrollEdge, parseHash,
    transition, roll, Wheel, emojiPicker, themePicker, disclosure, confetti,
    unlockAudio, chime, ICON,
  };
})();
</script>
<script>
(function () {
  'use strict';
  const { $, clamp } = CD;

  const EMOJIS = ['⏲️','🍅','💪','🧘','☕','🍳','📚','🎯','🏃','🎮','🛁','🔥','⏰','🥚','🎬','🎵'];
  const MAX_SEC = 99 * 3600 + 59 * 60 + 59;
  const pad = n => String(n).padStart(2, '0');

  function fmtClock(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function humanDuration(sec) {
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    const parts = [];
    if (h) parts.push(`${h} ${h === 1 ? 'hour' : 'hours'}`);
    if (m) parts.push(`${m} ${m === 1 ? 'minute' : 'minutes'}`);
    if (s) parts.push(`${s} ${s === 1 ? 'second' : 'seconds'}`);
    return parts.join(' ') || '0 seconds';
  }

  // ---- STATE ----
  const state = { emoji: EMOJIS[0], theme: 'galaxy', h: 0, m: 25, s: 0 };
  const totalSeconds = () => state.h * 3600 + state.m * 60 + state.s;

  const creatorEl = $('#creator');
  const stageEl = $('#timer');
  const inpName = $('#inp-name');

  // ---- DURATION WHEELS ----
  const num = (max) => s => { const n = parseInt(s, 10); return n >= 0 && n <= max ? n : -1; };
  const onWheel = () => { syncPresets(); updatePreview(); };
  const whH = CD.Wheel($('#wh-h'), { count: 100, index: state.h, label: 'Hours', unit: 'hours', parse: num(99), valueText: i => `${i} ${i === 1 ? 'hour' : 'hours'}`, onChange: i => { state.h = i; onWheel(); } });
  const whM = CD.Wheel($('#wh-m'), { count: 60, index: state.m, label: 'Minutes', unit: 'min', parse: num(59), valueText: i => `${i} ${i === 1 ? 'minute' : 'minutes'}`, onChange: i => { state.m = i; onWheel(); } });
  const whS = CD.Wheel($('#wh-s'), { count: 60, index: state.s, label: 'Seconds', unit: 'sec', parse: num(59), valueText: i => `${i} ${i === 1 ? 'second' : 'seconds'}`, onChange: i => { state.s = i; onWheel(); } });

  // Presets spin the wheels to the value, so you can see where it landed.
  const presets = Array.from(document.querySelectorAll('#presets .chip'));
  presets.forEach(b => b.addEventListener('click', () => {
    const sec = clamp(parseInt(b.dataset.sec, 10), 0, MAX_SEC);
    state.h = Math.floor(sec / 3600); state.m = Math.floor((sec % 3600) / 60); state.s = sec % 60;
    whH.setIndex(state.h); whM.setIndex(state.m); whS.setIndex(state.s);
    syncPresets();
    updatePreview();
  }));
  function syncPresets() {
    const t = totalSeconds();
    presets.forEach(b => b.setAttribute('aria-pressed', String(parseInt(b.dataset.sec, 10) === t)));
  }

  // ---- ICON + THEME ----
  CD.emojiPicker($('#emoji-grid'), $('#emoji-custom'), EMOJIS, state.emoji, e => { state.emoji = e; updatePreview(); });
  CD.themePicker($('#swatches'), state.theme, t => { state.theme = t; });

  // ---- PREVIEW ----
  let prevSec = null;
  function updatePreview() {
    const name = inpName.value.trim();
    $('#lp-emoji').textContent = state.emoji;
    $('#lp-name').textContent = name || 'Your Timer Name';
    $('#lp-name').classList.toggle('placeholder', !name);
    const sec = totalSeconds();
    const dir = prevSec === null ? 0 : Math.sign(sec - prevSec);
    prevSec = sec;
    CD.roll($('#lp-time'), fmtClock(sec), dir);
    $('#lp-caption').textContent = sec > 0 ? `Counts down from ${humanDuration(sec)}` : 'Set a duration to start.';
    $('#btn-copy').disabled = sec <= 0;
    $('#btn-open').disabled = sec <= 0;
  }
  inpName.addEventListener('input', updatePreview);
  inpName.addEventListener('keydown', e => { if (e.key === 'Enter') inpName.blur(); });

  function buildShareURL() {
    const sec = totalSeconds();
    if (sec <= 0) return null;
    const name = inpName.value.trim();
    let hash = `d=${sec}`;
    if (name) hash += `&n=${encodeURIComponent(name)}`;
    hash += `&e=${encodeURIComponent(state.emoji)}`;
    if (state.theme !== 'galaxy') hash += `&bg=${state.theme}`;
    return window.location.origin + window.location.pathname + '#' + hash;
  }

  let autoStart = false;  // creator hit Start: run the timer on arrival
  $('#btn-copy').addEventListener('click', () => { const u = buildShareURL(); if (u) CD.copyLink(u); });
  $('#btn-open').addEventListener('click', () => {
    const u = buildShareURL();
    if (!u) return;
    autoStart = true;
    CD.unlockAudio();
    window.location.hash = u.split('#')[1];
  });

  // ---- TIMER STAGE ----
  const RING_C = 2 * Math.PI * 94;
  const prog = $('#tm-prog');
  prog.style.strokeDasharray = RING_C.toFixed(2);

  let totalMs = 0, remainingMs = 0, endAt = 0;
  let running = false, finished = false;
  let raf = 0, finishTimer = 0, lastShown = null;
  let timerName = '', timerEmoji = '';

  const btnToggle = $('#btn-toggle');
  const btnReset = $('#btn-reset');

  function showTimer(params) {
    creatorEl.classList.remove('active');
    stageEl.classList.add('active');

    const sec = clamp(Math.floor(parseFloat(params.d) || 0), 1, MAX_SEC);
    timerName = params.n || '';
    timerEmoji = params.e || '⏲️';
    CD.applyTheme(params.bg || 'galaxy');

    $('#tm-emoji').textContent = timerEmoji;
    $('#tm-name').textContent = timerName;
    $('#tm-name').hidden = !timerName;

    totalMs = sec * 1000;
    reset();

    if (autoStart) { autoStart = false; toggle(); }
  }

  function setControls() {
    const cap = $('#tm-caption');
    cap.classList.toggle('done', finished);
    if (finished) {
      btnToggle.textContent = 'Restart'; btnToggle.className = 'round go press';
      cap.textContent = "Time's up!";
    } else if (running) {
      btnToggle.textContent = 'Pause'; btnToggle.className = 'round pause press';
      const end = new Date(endAt).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
      cap.textContent = `🔔 ${end}`;
      cap.setAttribute('aria-label', `Ends at ${end}`);
    } else if (remainingMs < totalMs) {
      btnToggle.textContent = 'Resume'; btnToggle.className = 'round go press';
      cap.textContent = 'Paused';
    } else {
      btnToggle.textContent = 'Start'; btnToggle.className = 'round go press';
      cap.textContent = humanDuration(Math.round(totalMs / 1000));
    }
    btnReset.disabled = !finished && !running && remainingMs >= totalMs;
  }

  function render() {
    const left = running ? Math.max(0, endAt - Date.now()) : remainingMs;
    // Show the second you're in (ceil), so 0:00 only appears at the very end.
    const sec = Math.ceil(left / 1000);
    if (sec !== lastShown) {
      const el = $('#tm-time');
      const txt = fmtClock(sec);
      el.classList.toggle('long', txt.length > 5);
      CD.roll(el, txt, lastShown === null ? 0 : Math.sign(sec - lastShown));
      el.setAttribute('aria-label', humanDuration(sec) + ' remaining');
      lastShown = sec;
      if (stageEl.classList.contains('active')) {
        document.title = (running ? `${fmtClock(sec)} · ` : '') + (timerName ? `${timerName} — Clockdown Timer` : 'Clockdown Timer');
      }
    }
    prog.style.strokeDashoffset = (RING_C * (1 - left / totalMs)).toFixed(2);
    return left;
  }

  function loop() {
    const left = render();
    if (left <= 0) { finish(); return; }
    raf = requestAnimationFrame(loop);
  }
  function stopLoop() {
    if (raf) { cancelAnimationFrame(raf); raf = 0; }
    clearTimeout(finishTimer);
  }

  function toggle() {
    CD.unlockAudio();
    if (finished) { reset(); toggle(); return; }
    if (running) {
      remainingMs = Math.max(0, endAt - Date.now());
      running = false;
      stopLoop();
    } else {
      endAt = Date.now() + remainingMs;
      running = true;
      // rAF stops in background tabs; this still fires so the chime isn't late.
      finishTimer = setTimeout(() => { if (running && Date.now() >= endAt - 20) finish(); }, remainingMs + 20);
      loop();
    }
    setControls();
    render();
  }

  function reset() {
    stopLoop();
    running = false;
    finished = false;
    remainingMs = totalMs;
    lastShown = null;
    stageEl.classList.remove('finished');
    setControls();
    render();
    document.title = timerName ? `${timerName} — Clockdown Timer` : 'Clockdown Timer';
  }

  function finish() {
    if (finished) return;
    stopLoop();
    running = false;
    finished = true;
    remainingMs = 0;
    render();
    setControls();
    document.title = "⏰ Time's up! — Clockdown Timer";
    // Sound, haptic and confetti on the same frame as the state change.
    CD.chime();
    CD.haptic([200, 100, 200]);
    CD.confetti();
    const cap = $('#tm-caption');
    if (!CD.reduceMotion.matches && cap.animate) {
      cap.animate([{ transform: 'scale(0.8)', opacity: 0, filter: 'blur(6px)' }, { transform: 'scale(1)', opacity: 1, filter: 'blur(0)' }],
        { duration: CD.SPRING.ms, easing: CD.SPRING.easing });
    }
  }

  btnToggle.addEventListener('click', toggle);
  btnReset.addEventListener('click', reset);

  // Keyboard: Space starts/pauses, R resets.
  document.addEventListener('keydown', e => {
    if (!stageEl.classList.contains('active') || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.target.closest && e.target.closest('button, input')) return;
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    else if (e.key === 'r' || e.key === 'R') { if (!btnReset.disabled) reset(); }
  });

  function shareTimer() {
    const emoji = (timerEmoji || '⏲️').trim();
    CD.share(window.location.href, timerName ? `${emoji} ${timerName} — timer running on Clockdown` : 'Timer running on Clockdown');
  }
  function goCreator() {
    history.pushState(null, '', window.location.pathname + window.location.search);
    route();
  }
  $('#btn-share').addEventListener('click', shareTimer);
  $('#btn-home').addEventListener('click', goCreator);
  $('#btn-new').addEventListener('click', goCreator);

  // ---- ROUTING ----
  function showCreator() {
    stageEl.classList.remove('active');
    creatorEl.classList.add('active');
    stopLoop();
    running = false;
    document.title = 'Clockdown Timer — Countdown From Any Duration';
    CD.applyTheme(state.theme);
    whH.refresh(); whM.refresh(); whS.refresh();
    updatePreview();
  }

  function route() {
    const params = CD.parseHash();
    CD.transition(() => {
      if (params && params.d) showTimer(params);
      else showCreator();
      window.scrollTo(0, 0);
    });
  }

  syncPresets();
  CD.scrollEdge($('#bar'));
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
