name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read   # to list open PRs when pruning stale previews

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to gh-pages branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save site files (all static assets, excluding VCS/CI/docs).
          # Generic copy so new pages/dirs deploy automatically.
          mkdir -p /tmp/site-build
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='*.md' \
            --exclude='tools' \
            ./ /tmp/site-build/

          # Check out gh-pages branch
          git fetch origin gh-pages || true
          if git rev-parse --verify origin/gh-pages >/dev/null 2>&1; then
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf .
          fi

          # Prune previews whose PR is no longer open. The PR-close cleanup in
          # pr-preview.yml normally removes them, but it can be skipped: the
          # shared "pages" concurrency group keeps only one pending run, so a
          # burst of writers can cancel a queued cleanup, and a GitHub outage
          # can outlast its push retries. Every merge to main runs this, so any
          # orphan is swept by the next deploy (or by running this workflow
          # manually). If the open-PR list can't be fetched, skip pruning
          # rather than treat "unknown" as "none open" and delete everything.
          if [ -d pr ]; then
            if OPEN_PRS=$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --limit 1000 --json number --jq '.[].number'); then
              PRUNED=""
              for dir in pr/*/; do
                n=$(basename "$dir")
                case "$n" in ''|*[!0-9]*) continue ;; esac   # only pr/<number>/
                if ! printf '%s\n' "$OPEN_PRS" | grep -qx "$n"; then
                  git rm -rf --quiet "pr/${n}"
                  PRUNED="${PRUNED} #${n}"
                fi
              done
              if [ -n "$PRUNED" ]; then
                echo "Pruned stale previews:${PRUNED}"
                git commit -m "Remove stale PR previews:${PRUNED}"
              else
                echo "No stale previews to prune"
              fi
            else
              echo "::warning::Could not list open PRs; skipping stale preview pruning"
            fi
          fi

          # Replace root files but preserve pr/ directory
          find . -maxdepth 1 ! -name '.' ! -name '.git' ! -name 'pr' -exec rm -rf {} +
          cp -r /tmp/site-build/* .

          git add -A
          git diff --cached --quiet || git commit -m "Deploy from main ($(date -u +%Y-%m-%dT%H:%M:%SZ))"

          # Push with rebase-retry to survive concurrent gh-pages writers
          for attempt in 1 2 3 4 5; do
            if git push origin gh-pages; then
              echo "Pushed on attempt ${attempt}"
              break
            fi
            if [ "${attempt}" -eq 5 ]; then
              echo "Push failed after ${attempt} attempts" >&2
              exit 1
            fi
            echo "Push rejected; rebasing onto latest gh-pages (attempt ${attempt})..."
            git fetch origin gh-pages
            git rebase origin/gh-pages || { git rebase --abort; exit 1; }
            sleep $((attempt * 2))
          done
